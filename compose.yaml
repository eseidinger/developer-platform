name: developer-platform
include:
  - infrastructure/proxy/compose.yaml
  - infrastructure/persistence/compose.yaml
  - infrastructure/persistence/shared-stores.yaml
  - infrastructure/monitoring/compose.yaml
  - infrastructure/identity/compose.yaml
  - platform/compose.yaml
networks:
  search-consoles:
    name: developer-platform-search-consoles
    internal: true
    ipam:
      config:
        - subnet: ${STORE_SEARCH_CONSOLE_SUBNET:-172.30.81.0/29}
  store-consoles:
    internal: true
  platform:
    name: developer-platform
    ipam:
      config:
        - subnet: ${PLATFORM_SUBNET:-172.30.80.0/24}
volumes:
  host_capacity:
  rustfs_data:
  qdrant_data:
  opensearch_data:
  postgres_console:
  postgres:
  caddy_data:
  caddy_config:
  monitoring_discovery:
  prometheus:
  grafana:
  loki:
  alertmanager:
  alloy:
