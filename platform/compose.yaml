services:
  telemetry-gateway:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "app.telemetry_gateway:app", "--host", "0.0.0.0", "--port", "4318", "--no-access-log"]
    environment:
      POSTGRES_HOST: postgres
      TELEMETRY_CATALOG_PASSWORD: ${TELEMETRY_CATALOG_PASSWORD:?Run scripts/init.py}
      KUBECONFIG: /run/telemetry/kubeconfig
    volumes:
      - ../.runtime/telemetry-reviewer.kubeconfig:/run/telemetry/kubeconfig:ro
      - /var/lib/developer-platform/tempo:/run/tempo:ro
    networks:
      platform:
        ipv4_address: ${TELEMETRY_GATEWAY_IP:-172.30.80.13}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4318/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
  platform-api:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init.py}
      DATABASE_KEY: ${DATABASE_KEY:?Run scripts/init.py}
      STORE_RELAY_PASSWORD: ${STORE_RELAY_PASSWORD:?Run scripts/init.py}
      STORE_RELAY_IP: ${STORE_RELAY_IP:-172.30.80.15}
      STORE_SSH_HOST: ${STORE_SSH_HOST:-}
      STORE_SSH_PORT: ${STORE_SSH_PORT:-2222}
      STORE_CONSOLE_POSTGRES_ENABLED: "true"
      STORE_CONSOLE_HTTP_ENABLED: "true"
      STORE_CAPACITY_BYTES: ${STORE_CAPACITY_BYTES:-}
      STORE_ENABLED_PROVIDERS: postgresql,${COMPOSE_PROFILES:-}
      RUSTFS_IP: ${RUSTFS_IP:-172.30.80.16}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      OPENSEARCH_IP: ${OPENSEARCH_IP:-172.30.80.17}
      OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-}
      OPENSEARCH_CA_FILE: /run/stores/opensearch-ca.pem
      QDRANT_IP: ${QDRANT_IP:-172.30.80.18}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      TELEMETRY_CATALOG_PASSWORD: ${TELEMETRY_CATALOG_PASSWORD:?Run scripts/init.py}
      DATABASE_BASTION_TOKEN: ${DATABASE_BASTION_TOKEN:?Run scripts/init.py}
      PLATFORM_AUDIT_PASSWORD: ${PLATFORM_AUDIT_PASSWORD:?Add the generated value from .env.example to .env}
      PLATFORM_AUDIT_READER_PASSWORD: ${PLATFORM_AUDIT_READER_PASSWORD:?Add the generated value from .env.example to .env}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://${IDENTITY_DOMAIN:-identity.localhost}/realms/platform}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-platform-api}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/platform/protocol/openid-connect/certs}
      APPLICATION_ACCESS_JWKS_URL: http://${KEYCLOAK_IP:-172.30.80.12}:8080/realms/platform/protocol/openid-connect/certs
      APPLICATION_IDENTITY_INTERNAL_URL: http://${KEYCLOAK_IP:-172.30.80.12}:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PROVISIONER_CLIENT_ID: platform-credential-provisioner
      KEYCLOAK_PROVISIONER_SECRET: ${KEYCLOAK_PROVISIONER_SECRET:?Run scripts/init.py}
      PLATFORM_BOOTSTRAP_SUBJECT: ${PLATFORM_BOOTSTRAP_SUBJECT:-}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-platform.localhost}
      PROXY_IP: ${PROXY_IP:-172.30.80.20}
      APPS_DOMAIN: ${APPS_DOMAIN:-apps.localhost}
      POSTGRES_IP: ${POSTGRES_IP:-172.30.80.10}
      PLATFORM_SUBNET: ${PLATFORM_SUBNET:-172.30.80.0/24}
      IMAGE_REGISTRIES: ${IMAGE_REGISTRIES:-docker.io,ghcr.io,quay.io}
      DRIFT_SCAN_INTERVAL_SECONDS: ${DRIFT_SCAN_INTERVAL_SECONDS:-300}
      REVISION_RETENTION: ${REVISION_RETENTION:-25}
      LOKI_URL: http://loki:3100
      PROMETHEUS_URL: http://prometheus:9090
      PLATFORM_METRICS_PROXY_CIDRS: ${PLATFORM_METRICS_PROXY_CIDRS:-}
      PLATFORM_OTLP_ENDPOINT: http://alloy:4318/v1/traces
      PLATFORM_TRACE_SAMPLE_RATE: ${PLATFORM_TRACE_SAMPLE_RATE:-1.0}
      TELEMETRY_GATEWAY_IP: ${TELEMETRY_GATEWAY_IP:-172.30.80.13}
      AI_MODEL_PROVIDER: ${AI_MODEL_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DATA_REGION: ${OPENAI_DATA_REGION:-eu}
      OPENAI_GLOBAL_PROCESSING_ACCEPTED: ${OPENAI_GLOBAL_PROCESSING_ACCEPTED:-false}
      OPENAI_EU_PROJECT_VERIFIED: ${OPENAI_EU_PROJECT_VERIFIED:-false}
      OPENAI_EU_PROCESSING_VERIFIED: ${OPENAI_EU_PROCESSING_VERIFIED:-false}
      OPENAI_MODIFIED_RETENTION_AMENDMENT_VERIFIED: ${OPENAI_MODIFIED_RETENTION_AMENDMENT_VERIFIED:-false}
      LANGCHAIN_TRACING_V2: "false"
      ALLOWED_EGRESS_CIDRS: ${ALLOWED_EGRESS_CIDRS:-}
      ALLOWED_EGRESS_PORTS: ${ALLOWED_EGRESS_PORTS:-}
      PROJECT_QUOTAS_JSON: "${PROJECT_QUOTAS_JSON:-{}}"
      CAPACITY_ADMISSION_ENABLED: ${CAPACITY_ADMISSION_ENABLED:-false}
      CAPACITY_RESERVE_CPU_MILLICORES: ${CAPACITY_RESERVE_CPU_MILLICORES:-2000}
      CAPACITY_RESERVE_MEMORY_MIB: ${CAPACITY_RESERVE_MEMORY_MIB:-8192}
      KUBECONFIG: /run/platform/kubeconfig
    volumes:
      - monitoring_discovery:/var/lib/platform-monitoring
      - ../.runtime/controller.kubeconfig:/run/platform/kubeconfig:ro
      - ../.runtime/stores/public:/run/stores:ro
    networks:
      platform:
        ipv4_address: ${PLATFORM_API_IP:-172.30.80.11}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-realm-init:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  store-access:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.stores.relay"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_IP: ${POSTGRES_IP:-172.30.80.10}
      RUSTFS_IP: ${RUSTFS_IP:-172.30.80.16}
      STORE_ENABLED_PROVIDERS: postgresql,${COMPOSE_PROFILES:-}
      OPENSEARCH_IP: ${OPENSEARCH_IP:-172.30.80.17}
      OPENSEARCH_CA_FILE: /run/stores/opensearch-ca.pem
      QDRANT_IP: ${QDRANT_IP:-172.30.80.18}
      STORE_RELAY_PASSWORD: ${STORE_RELAY_PASSWORD:?Run scripts/init.py}
    depends_on:
      platform-api:
        condition: service_healthy
    volumes:
      - ../.runtime/stores/public:/run/stores:ro
    networks:
      platform:
        ipv4_address: ${STORE_RELAY_IP:-172.30.80.15}
      store-consoles: {}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:19999/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
