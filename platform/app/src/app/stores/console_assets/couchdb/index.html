<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CouchDB · Developer Platform</title>
    <link rel="stylesheet" href="/__platform/couchdb/style.css" />
    <script src="/__platform/couchdb/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Developer Platform · CouchDB</p>
        <h1>Project database</h1>
        <p id="scope">Loading your active access lease…</p>
      </header>

      <section aria-labelledby="documents-title">
        <div class="heading">
          <h2 id="documents-title">Documents</h2>
          <button id="refresh" type="button">Refresh</button>
        </div>
        <p>Browse the first 50 document IDs at a time, or open one by ID.</p>
        <div class="row">
          <label for="document-id">Document ID</label>
          <input id="document-id" autocomplete="off" maxlength="256" />
          <button id="open" type="button">Open</button>
          <button id="new" type="button">New</button>
        </div>
        <ul id="documents" aria-label="Document IDs"></ul>
        <button id="next" type="button" hidden>Next 50</button>
      </section>

      <section aria-labelledby="editor-title">
        <div class="heading">
          <h2 id="editor-title">Document JSON</h2>
          <div class="row">
            <button id="save" type="button">Save</button>
            <button id="delete" type="button">Delete</button>
          </div>
        </div>
        <label for="document-json"
          >Edit an object; keep its _rev when updating.</label
        >
        <textarea id="document-json" spellcheck="false" rows="16">{}</textarea>
      </section>

      <section aria-labelledby="find-title">
        <h2 id="find-title">Mango query</h2>
        <label for="selector">Selector JSON</label>
        <textarea id="selector" spellcheck="false" rows="5">{}</textarea>
        <button id="find" type="button">Find up to 50 documents</button>
      </section>

      <section id="index-section" aria-labelledby="index-title" hidden>
        <h2 id="index-title">Create a Mango index</h2>
        <p>Use a named JSON index with up to 16 simple fields.</p>
        <label for="index-json">Index definition JSON</label>
        <textarea id="index-json" spellcheck="false" rows="5">
{"index":{"fields":["type"]},"name":"by_type","type":"json"}</textarea>
        <button id="create-index" type="button">Create index</button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
