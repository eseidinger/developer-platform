[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "developer-platform-api"
version = "0.1.0"
description = "Developer Platform control-plane API and hosted-access gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.43.114",
  "fastapi==0.141.1",
  "h11==0.16.0",
  "httpx2==2.13.1",
  "kubernetes==36.0.3",
  "langchain-openai>=1.6,<2",
  "openlit==1.45.0",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "psycopg[binary]==3.3.6",
  "PyJWT[crypto]==2.15.1",
  "uvicorn==0.53.0",
  "websockets==17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
analytics-fixtures = [
    "duckdb==1.5.6",
]
