[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "developer-platform-cli"
version = "0.3.0"
description = "Command-line client for the Developer Platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "rich>=13.9,<14",
  "typer>=0.15,<1",
  "platformdirs>=4,<5",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "respx>=0.22,<1",
]

[project.scripts]
devplat = "platform_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_cli"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
