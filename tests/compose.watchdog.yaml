services:
  mysql:
    image: mariadb:13.0.2
    environment:
      MARIADB_ROOT_PASSWORD: ${TEST_PASSWORD:?}
      MARIADB_DATABASE: watchdog
      MARIADB_USER: watchdog
      MARIADB_PASSWORD: ${TEST_PASSWORD:?}
    volumes:
      - ../watchdog/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
  php:
    build:
      context: .
      dockerfile: watchdog.Dockerfile
    environment:
      TEST_PASSWORD: ${TEST_PASSWORD:?}
      TEST_TOKEN: ${TEST_TOKEN:?}
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
    volumes:
      - ../watchdog/common.php:/app/common.php:ro
      - ../watchdog/cron.php:/app/cron.php:ro
      - ../watchdog/public:/app/public:ro
      - ./watchdog-config.php:/app/config.local.php:ro
    ports: ["127.0.0.1:18088:8080"]
    depends_on:
      mysql:
        condition: service_healthy
