---
all:
  hosts:
    localhost:
      ansible_connection: local
      watchdog_ssh_host: status.example.com
      watchdog_ssh_user: hosting-user
      watchdog_ssh_port: 22
      # The playbook prompts privately for the SSH password.
      # For automation, supply watchdog_ssh_password through Ansible Vault.
      # Keep this directory outside any existing public document root.
      # Point the status site's DocumentRoot exclusively to its public/ child.
      watchdog_install_dir: /home/hosting-user/watchdog
      # PHP and cron must run as a user able to read the mode-0600 config.
      # Required on first deployment; omit later to preserve remote settings.
      watchdog_config_file: "{{ playbook_dir }}/../src/config.local.php"
      # Enable only if the hosting provider permits managing the user crontab.
      watchdog_manage_cron: false
      watchdog_php_binary: /usr/bin/php
