services:
  rustfs:
    profiles: [s3]
    image: rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_PREFIX: /rustfs/console
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_METRIC_ENDPOINT: http://alloy:4320/v1/metrics
      RUSTFS_OBS_METER_INTERVAL: "30"
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "false"
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
    volumes: [rustfs_data:/data]
    tmpfs: ["/logs:uid=10001,gid=10001,size=64m", "/tmp:uid=10001,gid=10001,size=32m"]
    networks:
      platform:
        ipv4_address: ${RUSTFS_IP:-172.30.80.16}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9000/health/ready]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5

  qdrant:
    profiles: [qdrant]
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${STORE_MONITOR_PASSWORD:-}
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__SERVICE__JWT_RBAC: "true"
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
      QDRANT_INIT_FILE_PATH: /qdrant/storage/.initialized
    volumes: [qdrant_data:/qdrant/storage]
    networks:
      platform:
        ipv4_address: ${QDRANT_IP:-172.30.80.18}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r status <&3; [[ $$status == *'200 OK'* ]]"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5

  opensearch:
    profiles: [opensearch]
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    restart: unless-stopped
    hostname: opensearch
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - ../.runtime/stores/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ../.runtime/stores/opensearch/ca.pem:/usr/share/opensearch/config/ca.pem:ro
      - ../.runtime/stores/opensearch/node.pem:/usr/share/opensearch/config/node.pem:ro
      - ../.runtime/stores/opensearch/node-key.pem:/usr/share/opensearch/config/node-key.pem:ro
    networks:
      platform:
        ipv4_address: ${OPENSEARCH_IP:-172.30.80.17}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD, bash, -euc, "curl --fail --silent --cacert /usr/share/opensearch/config/ca.pem https://opensearch:9200/_plugins/_security/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10

  opensearch-init:
    profiles: [opensearch]
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    user: "1000:1000"
    restart: "no"
    entrypoint: [bash, /bootstrap.sh]
    volumes:
      - ../.runtime/stores/opensearch/ca.pem:/run/store-security/ca.pem:ro
      - ../.runtime/stores/opensearch/admin.pem:/run/store-security/admin.pem:ro
      - ../.runtime/stores/opensearch/admin-key.pem:/run/store-security/admin-key.pem:ro
      - ../.runtime/stores/opensearch/bootstrap:/run/store-security/bootstrap:ro
      - ./opensearch-bootstrap.sh:/bootstrap.sh:ro
    networks:
      platform:
        ipv4_address: ${OPENSEARCH_INIT_IP:-172.30.80.19}
    depends_on:
      opensearch:
        condition: service_started
    mem_limit: 512m
    cpus: 1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  opensearch-dashboards:
    profiles: [opensearch]
    image: opensearchproject/opensearch-dashboards:3.9.0@sha256:4bdb8ded547ce7f4c379a10261f1b4aad58726900c215be570a7d1fe86f2a7d8
    restart: unless-stopped
    environment:
      STORE_OPENSEARCH_BACKEND_URL: http://${STORE_SEARCH_API_IP:-172.30.81.2}:8000
      OPENSEARCH_DASHBOARDS_PASSWORD: ${OPENSEARCH_DASHBOARDS_PASSWORD:-}
      STORE_OPENSEARCH_CONSOLE_COOKIE_KEY: ${STORE_OPENSEARCH_CONSOLE_COOKIE_KEY:-}
    volumes:
      - ./opensearch-dashboards.yaml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    networks:
      search-consoles:
        ipv4_address: ${OPENSEARCH_DASHBOARDS_IP:-172.30.81.3}
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=64m"]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:5601/app/login]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 12

  neo4j-controller:
    build: ../platform
    user: "0:0"
    restart: unless-stopped
    command: [uvicorn, "app.stores.neo4j_controller:create_app", --factory, --host, "0.0.0.0", --port, "8091", --no-access-log]
    environment:
      STORE_ENABLED_PROVIDERS: postgresql,${COMPOSE_PROFILES:-}
      PLATFORM_API_IP: ${PLATFORM_API_IP:-172.30.80.11}
      NEO4J_CONTROLLER_KEY: ${NEO4J_CONTROLLER_KEY:?Run scripts/init.py}
      NEO4J_MAX_INSTANCES: ${NEO4J_MAX_INSTANCES:-4}
      NEO4J_INSTANCE_MEMORY_BYTES: ${NEO4J_INSTANCE_MEMORY_BYTES:-1610612736}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    networks:
      platform:
        ipv4_address: ${NEO4J_CONTROLLER_IP:-172.30.80.31}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
