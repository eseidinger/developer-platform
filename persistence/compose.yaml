services:
  postgres:
    image: postgres:17.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init.py}
      POSTGRES_DB: platform
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      platform:
        ipv4_address: ${POSTGRES_IP:-172.30.80.10}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 6g
    cpus: 3
    shm_size: 256m
