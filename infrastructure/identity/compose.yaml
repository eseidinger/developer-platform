---
services:
  keycloak-db-init:
    image: postgres:18.6-trixie
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap/init-database.sh"]
    volumes:
      - ./init-database.sh:/bootstrap/init-database.sh:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init.py}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run scripts/init.py}
    networks:
      platform:
        ipv4_address: ${KEYCLOAK_DB_INIT_IP:-172.30.80.28}
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.1
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run scripts/init.py}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: >-
        ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init.py}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: https://${IDENTITY_DOMAIN:-identity.localhost}
      KC_PROXY_HEADERS: xforwarded
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-platform.localhost}
    volumes:
      - ./realm-platform.json:/opt/keycloak/data/import/realm-platform.json:ro
    networks:
      platform:
        ipv4_address: ${KEYCLOAK_IP:-172.30.80.12}
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: 1

  keycloak-realm-init:
    image: quay.io/keycloak/keycloak:26.4.1
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap/init-realm.sh"]
    volumes:
      - ./init-realm.sh:/bootstrap/init-realm.sh:ro
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init.py}
      KEYCLOAK_PROVISIONER_SECRET: >-
        ${KEYCLOAK_PROVISIONER_SECRET:?Run scripts/init.py}
      STORE_CONSOLE_OIDC_SECRET: >-
        ${STORE_CONSOLE_OIDC_SECRET:?Run scripts/init.py}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-platform.localhost}
    networks:
      platform:
        ipv4_address: ${KEYCLOAK_REALM_INIT_IP:-172.30.80.29}
    depends_on:
      keycloak:
        condition: service_started
