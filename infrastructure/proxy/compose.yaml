services:
  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports: ["${EDGE_BIND_IP:-127.0.0.1}:80:80", "${EDGE_BIND_IP:-127.0.0.1}:443:443", "${EDGE_BIND_IP:-127.0.0.1}:443:443/udp"]
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-platform.localhost}
      IDENTITY_DOMAIN: ${IDENTITY_DOMAIN:-identity.localhost}
      APPS_DOMAIN: ${APPS_DOMAIN:-apps.localhost}
      TLS_EMAIL: ${TLS_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      store-consoles:
        aliases:
          - ${IDENTITY_DOMAIN:-identity.localhost}
      platform:
        ipv4_address: ${PROXY_IP:-172.30.80.20}
    mem_limit: 256m
