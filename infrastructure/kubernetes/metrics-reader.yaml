---
# Project-scoped service-proxy permissions are granted by the provisioner.
# This manifest creates only the shared account and its external token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-metrics-reader
  namespace: platform-system
---
apiVersion: v1
kind: Secret
metadata:
  name: workload-metrics-reader-token
  namespace: platform-system
  annotations:
    kubernetes.io/service-account.name: workload-metrics-reader
type: kubernetes.io/service-account-token
