apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioner
  namespace: platform-system
---
# The controller is a trusted infrastructure administrator, never a tenant account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-provisioner
rules:
  - apiGroups: [""]
    resources: [namespaces, secrets, services, resourcequotas, limitranges]
    verbs: [get, list, create, patch, update]
  # RBAC cannot scope delete by name; the admission policy below limits it to managed project namespaces.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [metrics.k8s.io]
    # Pod metrics support project usage; node metrics support the platform-admin capacity view.
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, update]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-provisioner
subjects:
  - kind: ServiceAccount
    name: provisioner
    namespace: platform-system
---
# The provisioner may delete only platform-created project namespaces (retirement).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: provisioner-namespace-delete
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["namespaces"]
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:platform-system:provisioner' ||
        (oldObject.metadata.name.startsWith('project-') &&
        has(oldObject.metadata.labels) &&
        'platform.example/managed' in oldObject.metadata.labels &&
        oldObject.metadata.labels['platform.example/managed'] == 'true')
      message: The provisioner may only delete managed project-* namespaces.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: provisioner-namespace-delete
spec:
  policyName: provisioner-namespace-delete
  validationActions: [Deny]
---
# External controller credential; revoke by deleting this secret and re-bootstrap.
apiVersion: v1
kind: Secret
metadata:
  name: provisioner-token
  namespace: platform-system
  annotations:
    kubernetes.io/service-account.name: provisioner
type: kubernetes.io/service-account-token
