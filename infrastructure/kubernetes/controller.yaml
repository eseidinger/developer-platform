apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioner
  namespace: platform-system
---
# The controller is a trusted infrastructure administrator, never a tenant account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-provisioner
rules:
  - apiGroups: [""]
    resources: [namespaces, secrets, services, resourcequotas, limitranges]
    verbs: [get, list, create, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-provisioner
subjects:
  - kind: ServiceAccount
    name: provisioner
    namespace: platform-system
---
# External controller credential; revoke by deleting this secret and re-bootstrap.
apiVersion: v1
kind: Secret
metadata:
  name: provisioner-token
  namespace: platform-system
  annotations:
    kubernetes.io/service-account.name: provisioner
type: kubernetes.io/service-account-token
