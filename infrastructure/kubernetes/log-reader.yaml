# Trusted administrative telemetry reader, never a tenant credential. Filters
# select managed project workloads; RBAC itself is cluster-wide read-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-log-reader
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-workload-log-reader
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-workload-log-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-workload-log-reader
subjects:
  - kind: ServiceAccount
    name: workload-log-reader
    namespace: platform-system
---
apiVersion: v1
kind: Secret
metadata:
  name: workload-log-reader-token
  namespace: platform-system
  annotations:
    kubernetes.io/service-account.name: workload-log-reader
type: kubernetes.io/service-account-token
