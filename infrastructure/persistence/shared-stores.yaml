---
services:
  rustfs:
    profiles: [s3]
    image:
      "rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4\
        259427011f6120acc2c9acf51587"
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_PREFIX: /rustfs/console
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_METRIC_ENDPOINT: http://alloy:4320/v1/metrics
      RUSTFS_OBS_METER_INTERVAL: "30"
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "false"
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
    volumes: [rustfs_data:/data]
    tmpfs:
      - "/logs:uid=10001,gid=10001,size=64m"
      - "/tmp:uid=10001,gid=10001,size=32m"
    networks:
      platform:
        ipv4_address: ${RUSTFS_IP:-172.30.80.16}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9000/health/ready]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5
