---
# Steady-state resources include regular containers and native restartable init
# sidecars.
# Limits are omitted unless every participating container/pod has a positive
# limit.
groups:
  - name: workload-capacity
    interval: 30s
    rules:
      - record: platform:pod_active:info
        expr: >-
          max by (namespace, pod) (kube_pod_status_phase{job="kubernetes-state",
          namespace=~"project-.+", phase=~"Pending|Running|Unknown"} == 1)

      - record: platform:pod_deployment:info
        expr: >-
          max by (namespace, pod, deployment)
          (label_replace(kube_pod_owner{job="kubernetes-state",
          namespace=~"project-.+", owner_kind="ReplicaSet",
          owner_is_controller="true"}, "replicaset", "$1", "owner_name", "(.+)")
          * on(namespace, replicaset) group_left(deployment)
          label_replace(kube_replicaset_owner{job="kubernetes-state",
          namespace=~"project-.+", owner_kind="Deployment",
          owner_is_controller="true"}, "deployment", "$1", "owner_name",
          "(.+)")) and on(namespace, pod) platform:pod_active:info

      - record: platform:pod_cpu_usage_cores:sum
        expr: >-
          sum by (namespace, pod) (max by (namespace, pod, container)
          (rate(container_cpu_usage_seconds_total{job="kubernetes-cadvisor",
          container!="", container!="POD"}[5m]))) and on(namespace, pod)
          platform:pod_active:info

      - record: platform:pod_memory_working_set_bytes:sum
        expr: >-
          sum by (namespace, pod) (max by (namespace, pod, container)
          (container_memory_working_set_bytes{job="kubernetes-cadvisor",
          container!="", container!="POD"})) and on(namespace, pod)
          platform:pod_active:info

      - record: platform:pod_containers:count
        expr: >-
          count by (namespace, pod) (max by (namespace, pod, container)
          (kube_pod_container_info{job="kubernetes-state",
          namespace=~"project-.+"}) or max by (namespace, pod, container)
          (kube_pod_init_container_info{job="kubernetes-state",
          namespace=~"project-.+", restart_policy="Always"})) and on(namespace,
          pod) platform:pod_active:info

      - record: platform:pod_cpu_requests_cores:sum
        expr: >-
          sum by (namespace, pod) (max by (namespace, pod, container)
          (kube_pod_container_resource_requests{job="kubernetes-state",
          namespace=~"project-.+", resource="cpu"} or
          (kube_pod_init_container_resource_requests{job="kubernetes-state",
          namespace=~"project-.+", resource="cpu"} * on(namespace, pod,
          container) group_left() (max by (namespace, pod, container)
          (kube_pod_init_container_info{job="kubernetes-state",
          namespace=~"project-.+", restart_policy="Always"}))))) and
          on(namespace, pod) platform:pod_active:info

      - record: platform:pod_cpu_limits_cores:sum
        expr: >-
          sum by (namespace, pod) (max by (namespace, pod, container)
          (kube_pod_container_resource_limits{job="kubernetes-state",
          namespace=~"project-.+", resource="cpu"} or
          (kube_pod_init_container_resource_limits{job="kubernetes-state",
          namespace=~"project-.+", resource="cpu"} * on(namespace, pod,
          container) group_left() (max by (namespace, pod, container)
          (kube_pod_init_container_info{job="kubernetes-state",
          namespace=~"project-.+", restart_policy="Always"}))))) and
          on(namespace, pod) platform:pod_active:info and on(namespace, pod)
          (count by (namespace, pod) ((max by (namespace, pod, container)
          (kube_pod_container_resource_limits{job="kubernetes-state",
          namespace=~"project-.+", resource="cpu"} or
          (kube_pod_init_container_resource_limits{job="kubernetes-state",
          namespace=~"project-.+", resource="cpu"} * on(namespace, pod,
          container) group_left() (max by (namespace, pod, container)
          (kube_pod_init_container_info{job="kubernetes-state",
          namespace=~"project-.+", restart_policy="Always"}))))) > 0) ==
          on(namespace, pod) platform:pod_containers:count)

      - record: platform:pod_memory_requests_bytes:sum
        expr: >-
          sum by (namespace, pod) (max by (namespace, pod, container)
          (kube_pod_container_resource_requests{job="kubernetes-state",
          namespace=~"project-.+", resource="memory"} or
          (kube_pod_init_container_resource_requests{job="kubernetes-state",
          namespace=~"project-.+", resource="memory"} * on(namespace, pod,
          container) group_left() (max by (namespace, pod, container)
          (kube_pod_init_container_info{job="kubernetes-state",
          namespace=~"project-.+", restart_policy="Always"}))))) and
          on(namespace, pod) platform:pod_active:info

      - record: platform:pod_memory_limits_bytes:sum
        expr: >-
          sum by (namespace, pod) (max by (namespace, pod, container)
          (kube_pod_container_resource_limits{job="kubernetes-state",
          namespace=~"project-.+", resource="memory"} or
          (kube_pod_init_container_resource_limits{job="kubernetes-state",
          namespace=~"project-.+", resource="memory"} * on(namespace, pod,
          container) group_left() (max by (namespace, pod, container)
          (kube_pod_init_container_info{job="kubernetes-state",
          namespace=~"project-.+", restart_policy="Always"}))))) and
          on(namespace, pod) platform:pod_active:info and on(namespace, pod)
          (count by (namespace, pod) ((max by (namespace, pod, container)
          (kube_pod_container_resource_limits{job="kubernetes-state",
          namespace=~"project-.+", resource="memory"} or
          (kube_pod_init_container_resource_limits{job="kubernetes-state",
          namespace=~"project-.+", resource="memory"} * on(namespace, pod,
          container) group_left() (max by (namespace, pod, container)
          (kube_pod_init_container_info{job="kubernetes-state",
          namespace=~"project-.+", restart_policy="Always"}))))) > 0) ==
          on(namespace, pod) platform:pod_containers:count)

      - record: platform:deployment_cpu_usage_cores:sum
        expr: >-
          sum by (namespace, deployment) (platform:pod_cpu_usage_cores:sum *
          on(namespace, pod) group_left(deployment)
          platform:pod_deployment:info)

      - record: platform:deployment_memory_working_set_bytes:sum
        expr: >-
          sum by (namespace, deployment)
          (platform:pod_memory_working_set_bytes:sum * on(namespace, pod)
          group_left(deployment) platform:pod_deployment:info)

      - record: platform:deployment_cpu_requests_cores:sum
        expr: >-
          sum by (namespace, deployment) (platform:pod_cpu_requests_cores:sum *
          on(namespace, pod) group_left(deployment)
          platform:pod_deployment:info)

      - record: platform:deployment_cpu_limits_cores:sum
        expr: >-
          sum by (namespace, deployment) (platform:pod_cpu_limits_cores:sum *
          on(namespace, pod) group_left(deployment)
          platform:pod_deployment:info) and on(namespace, deployment) (count by
          (namespace, deployment) (platform:pod_cpu_limits_cores:sum *
          on(namespace, pod) group_left(deployment)
          platform:pod_deployment:info) == on(namespace, deployment) count by
          (namespace, deployment) (platform:pod_deployment:info))

      - record: platform:deployment_memory_requests_bytes:sum
        expr: >-
          sum by (namespace, deployment) (platform:pod_memory_requests_bytes:sum
          * on(namespace, pod) group_left(deployment)
          platform:pod_deployment:info)

      - record: platform:deployment_memory_limits_bytes:sum
        expr: >-
          sum by (namespace, deployment) (platform:pod_memory_limits_bytes:sum *
          on(namespace, pod) group_left(deployment)
          platform:pod_deployment:info) and on(namespace, deployment) (count by
          (namespace, deployment) (platform:pod_memory_limits_bytes:sum *
          on(namespace, pod) group_left(deployment)
          platform:pod_deployment:info) == on(namespace, deployment) count by
          (namespace, deployment) (platform:pod_deployment:info))
