global:
  scrape_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: host
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: kubernetes-state
    static_configs:
      - targets: ["k3d-workloads-server-0:30090"]
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: applications
    metrics_path: /probe
    scrape_timeout: 10s
    file_sd_configs:
      - files: [/etc/prometheus/discovery/applications.json]
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [probe_module]
        target_label: __param_module
      - source_labels: [probe_hostname]
        target_label: __param_hostname
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - action: labeldrop
        regex: 'probe_module|probe_hostname'
  - job_name: application-metrics
    scheme: https
    scrape_interval: 30s
    scrape_timeout: 5s
    sample_limit: 500
    body_size_limit: 256KB
    label_limit: 16
    label_name_length_limit: 64
    label_value_length_limit: 128
    authorization:
      type: Bearer
      credentials_file: /run/prometheus/metrics-reader.token
    tls_config:
      ca_file: /run/prometheus/metrics-reader-ca.crt
    file_sd_configs:
      - files: [/etc/prometheus/discovery/application-metrics.json]
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [proxy_path]
        target_label: __metrics_path__
      - action: labeldrop
        regex: proxy_path
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'http_server_requests_seconds_(count|sum|bucket)|http_requests_total|http_request_duration_seconds_(count|sum|bucket)|jvm_memory_(used_bytes|committed_bytes|max_bytes|usage_after_gc)|jvm_buffer_(count_buffers|memory_used_bytes|total_capacity_bytes)|jvm_gc_(live_data_size_bytes|max_data_size_bytes|memory_allocated_bytes_total|memory_promoted_bytes_total|overhead|pause_seconds_(count|sum|max))|jvm_threads_(live_threads|daemon_threads|peak_threads|states_threads|started_threads_total)|jvm_classes_(loaded_classes|unloaded_classes_total)|process_(cpu_usage|uptime_seconds|start_time_seconds|files_open_files|files_max_files)|system_(cpu_usage|cpu_count|load_average_1m)'
        action: keep
      # Runtime dimensions belong only to reviewed JVM metrics, never HTTP request IDs.
      - source_labels: [__name__]
        regex: 'http_.*'
        target_label: area
        replacement: ''
      - source_labels: [__name__]
        regex: 'http_.*'
        target_label: id
        replacement: ''
      - source_labels: [__name__]
        regex: 'http_.*'
        target_label: state
        replacement: ''
      - source_labels: [__name__]
        regex: 'http_.*'
        target_label: gc
        replacement: ''
      - source_labels: [__name__]
        regex: 'http_.*'
        target_label: action
        replacement: ''
      - source_labels: [__name__]
        regex: 'http_.*'
        target_label: cause
        replacement: ''
      - source_labels: [__name__]
        regex: 'http_.*'
        target_label: pool
        replacement: ''
      - action: labelkeep
        regex: '__name__|job|instance|project|environment|application|component|namespace|method|status|outcome|le|area|id|state|gc|action|cause|pool'
