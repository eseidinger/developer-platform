global:
  scrape_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: host
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: kubernetes-state
    static_configs:
      - targets: ["k3d-workloads-server-0:30090"]
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: applications
    metrics_path: /probe
    scrape_timeout: 10s
    file_sd_configs:
      - files: [/etc/prometheus/discovery/applications.json]
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [probe_module]
        target_label: __param_module
      - source_labels: [probe_hostname]
        target_label: __param_hostname
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - action: labeldrop
        regex: 'probe_module|probe_hostname'
