---
rule_files:
  - ../alerts.yaml
evaluation_interval: 1m
tests:

  - name: native collector missing is not success
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: NativeStoreCollectorStale
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Native store metrics collector is stale or unavailable

  - name: disabled RustFS does not require telemetry
    interval: 1m
    input_series:
      - series: 'platform_native_selected{provider="s3"}'
        values: '0+0x6'
    alert_rule_test:
      - eval_time: 5m
        alertname: RustFSTelemetryUnavailable
        exp_alerts: []

  - name: collector failure fires and resolves
    interval: 1m
    input_series:
      - series: 'platform_native_collection_up{provider="postgresql"}'
        values: '0+0x4 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: NativeStoreCollectionUnavailable
        exp_alerts:
          - exp_labels: {severity: warning, provider: postgresql}
            exp_annotations:
              summary: Native postgresql statistics collection failed
              description: >-
                Retained values may be stale. Inspect private collector
                configuration, permissions and provider readiness.
      - eval_time: 5m
        alertname: NativeStoreCollectionUnavailable
        exp_alerts: []

  - name: selected PostgreSQL extension disappears
    interval: 1m
    input_series:
      - series: >-
          platform_native_postgresql_extension_installed{provider="postgresql",
          project="alpha",resource_id="fixture",scope="resource",extension="pgmq"}
        values: '0+0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: PostgreSQLExtensionMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: postgresql
              project: alpha
              resource_id: fixture
              scope: resource
              extension: pgmq
            exp_annotations:
              summary: Selected PostgreSQL extension pgmq is missing
              description: >-
                Inspect the named resource and installed image before reopening
                application access or recovery quarantine.
