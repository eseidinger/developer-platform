services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=4GB"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [platform]
    mem_limit: 1g
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/init.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana:/var/lib/grafana
      - ./datasources.yaml:/etc/grafana/provisioning/datasources/default.yaml:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [platform]
    mem_limit: 512m
  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    networks: [platform]
    mem_limit: 768m
  alloy:
    image: grafana/alloy:v1.10.2
    restart: unless-stopped
    user: "0"
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [platform]
    mem_limit: 256m
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ./alertmanager.yaml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    networks: [platform]
    mem_limit: 128m
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host", "--path.procfs=/host/proc", "--path.sysfs=/host/sys"]
    volumes: ["/:/host:ro"]
    networks: [platform]
    mem_limit: 128m
