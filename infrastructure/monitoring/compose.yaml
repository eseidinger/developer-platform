services:
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yaml"]
    volumes:
      - ./blackbox.yaml:/etc/blackbox/blackbox.yaml:ro
    networks:
      platform:
        ipv4_address: ${BLACKBOX_EXPORTER_IP:-172.30.80.21}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
  prometheus:
    depends_on: [platform-api]
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=4GB"]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yaml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
      - monitoring_discovery:/etc/prometheus/discovery:ro
      - ../../.runtime/metrics-reader.token:/run/prometheus/metrics-reader.token:ro
      - ../../.runtime/metrics-reader-ca.crt:/run/prometheus/metrics-reader-ca.crt:ro
    ports: ["127.0.0.1:9090:9090"]
    networks:
      platform:
        ipv4_address: ${PROMETHEUS_IP:-172.30.80.22}
    mem_limit: 1g
  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/init.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana:/var/lib/grafana
      - ./datasources.yaml:/etc/grafana/provisioning/datasources/default.yaml:ro
      - ./dashboards.yaml:/etc/grafana/provisioning/dashboards/default.yaml:ro
      - ./dashboards:/var/lib/grafana/provisioned-dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks:
      platform:
        ipv4_address: ${GRAFANA_IP:-172.30.80.23}
    mem_limit: 512m
  tempo:
    image: grafana/tempo@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    restart: unless-stopped
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - /var/lib/developer-platform/tempo:/data/tempo
      # Tempo 3 live-store and internal runtime data default under /var/tempo.
      - /var/lib/developer-platform/tempo:/var/tempo
    networks:
      platform:
        ipv4_address: ${TEMPO_IP:-172.30.80.24}
    user: "10001:10001"
    mem_limit: 2g
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    networks:
      platform:
        ipv4_address: ${LOKI_IP:-172.30.80.25}
    mem_limit: 768m
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    # UID 0 reads host Docker logs. The pinned image's state directory is
    # 473:473 mode 0770; match its group without restoring DAC capabilities.
    user: "0:473"
    command: ["run", "--storage.path=/var/lib/alloy", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ../../.runtime/log-reader.kubeconfig:/run/alloy/log-reader.kubeconfig:ro
      - alloy:/var/lib/alloy
    networks:
      platform:
        ipv4_address: ${ALLOY_IP:-172.30.80.14}
    mem_limit: 512m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # The pinned image provides bash, but no curl/wget. No host port needed.
      test:
        - CMD
        - /usr/bin/bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/12345; printf "GET /-/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -r -t 3 status <&3; [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yaml", "--storage.path=/alertmanager"]
    restart: unless-stopped
    volumes:
      - ${ALERTMANAGER_CONFIG_DIR:-.}:/etc/alertmanager:ro
      - alertmanager:/alertmanager
    networks:
      platform:
        ipv4_address: ${ALERTMANAGER_IP:-172.30.80.26}
    mem_limit: 128m
  node-exporter:
    depends_on: [platform-api]
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host", "--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--collector.textfile.directory=/discovery"]
    volumes: ["/:/host:ro", "monitoring_discovery:/discovery:ro"]
    networks:
      platform:
        ipv4_address: ${NODE_EXPORTER_IP:-172.30.80.27}
    mem_limit: 128m
