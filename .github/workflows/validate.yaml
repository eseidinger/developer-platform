---
name: validate
"on": [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python3 scripts/init.py
      - run: docker compose config --quiet
      - run: python3 scripts/generate/generate-dashboards.py --check
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project platform/app --locked
      - run: uv pip install --system 'ansible-core>=2.16,<2.22'
      - run: >-
          uv run --project platform/app python -m unittest discover
          -s scripts/tests/unit -v
      - run: >-
          uv run --project platform/app
          --with 'ansible-core>=2.16,<2.22' --with pyyaml python
          -m unittest discover -s ansible/tests/unit -v
      - run: python3 -m unittest discover -s operations/backup/tests -v
      - run: python3 -m unittest discover -s operations/heartbeat/tests -v
      - run: python3 scripts/tests/components/networking/verify-local-https.py
      - run: >-
          uv run --project platform/app python
          scripts/tests/components/observability/check-monitoring.py
      - run: >-
          uv run --project platform/app python
          scripts/tests/components/observability/check-application-metrics.py
      - run: >-
          uv run --project platform/app python
          scripts/tests/components/observability/check-postgres-monitoring.py
      - run: >-
          uv run --project platform/app python
          scripts/tests/components/observability/check-workload-logs.py
      - run: python3 scripts/checks/check-doc-links.py
      - run: python3 -m compileall -q scripts operations
      - run: bash -n scripts/up.sh scripts/down.sh
      - name: Validate platform Ansible playbooks
        run: |
          for playbook in \
            ansible/deploy.yml \
            ansible/operations/*.yml \
            ansible/tests/platform/*.yml; do
            ansible-playbook -i ansible/inventory.example.yml \
              "$playbook" --syntax-check
          done
      - run: php operations/watchdog/tests/watchdog.php
      - run: php operations/watchdog/tests/backup.php
      - run: >-
          php -d curl.cainfo="$RUNNER_TEMP/watchdog-smtp-cert.pem"
          -d sendmail_path=/bin/true
          operations/watchdog/tests/watchdog-mail.php
