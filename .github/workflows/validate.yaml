name: validate
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"
      - run: python3 scripts/init.py
      - run: docker compose config --quiet
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q platform scripts watchdog/scripts
      - run: bash -n scripts/up.sh scripts/down.sh scripts/backup.sh
      - run: find watchdog tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php watchdog/tests/watchdog.php
      - run: php watchdog/tests/backup.php
      - run: php -d curl.cainfo="$RUNNER_TEMP/watchdog-smtp-cert.pem" -d sendmail_path=/bin/true watchdog/tests/watchdog-mail.php
