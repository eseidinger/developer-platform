name: validate
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python3 scripts/init.py
      - run: docker compose config --quiet
      - run: pip install -r platform/tests/requirements.txt 'ansible-core>=2.16,<2.22'
      - run: python3 -m unittest discover -s platform/tests -v
      - run: python3 -m unittest discover -s ansible/tests -v
      - run: python3 -m unittest discover -s operations/backup/tests -v
      - run: python3 -m unittest discover -s operations/heartbeat/tests -v
      - run: python3 scripts/check-monitoring.py
      - run: python3 -m compileall -q platform scripts operations
      - run: bash -n scripts/up.sh scripts/down.sh
      - name: Validate platform Ansible playbooks
        run: |
          for playbook in ansible/*.yml; do
            case "$playbook" in
              *inventory*|*vars*) continue ;;
            esac
            ansible-playbook -i ansible/inventory.example.yml "$playbook" --syntax-check
          done
      - run: find operations platform/tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php operations/watchdog/tests/watchdog.php
      - run: php operations/watchdog/tests/backup.php
      - run: php -d curl.cainfo="$RUNNER_TEMP/watchdog-smtp-cert.pem" -d sendmail_path=/bin/true operations/watchdog/tests/watchdog-mail.php
