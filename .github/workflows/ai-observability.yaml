---
name: AI observability
"on":
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  telemetry-pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        signal: [metric, trace]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project platform/app --locked
      - name: Fetch reviewed collector and storage images
        run: |
          docker pull grafana/alloy:v1.19.2
          docker pull prom/prometheus:v3.14.0
          docker pull grafana/tempo@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
      - name: Verify production telemetry against disposable services
        env:
          SIGNAL: ${{ matrix.signal }}
        run: |
          mkdir -p .runtime/ci
          uv run --project platform/app python \
            "scripts/tests/components/observability/verify-ai-$SIGNAL-pipeline.py" \
            2>&1 | tee .runtime/ci/telemetry.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ai-${{ matrix.signal }}-failure
          path: .runtime/ci/
          retention-days: 7
          if-no-files-found: ignore
