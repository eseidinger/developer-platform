---
name: cli
"on":
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -e 'platform/cli[dev]' build twine
      - name: Validate release version before building
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: python3 scripts/release/cli-release.py
      - run: python3 scripts/generate/generate-cli-contract.py --check
      - run: devplat contract check --output json
      - name: Build release distributions once
        run: python3 -m build --outdir .runtime/ci/cli-dist platform/cli
      - run: python3 -m twine check .runtime/ci/cli-dist/*
      - name: Test the installed wheel rather than the editable checkout
        run: |
          pip uninstall -y developer-platform-cli
          pip install .runtime/ci/cli-dist/*.whl
          python3 -m pytest platform/cli/tests
          devplat contract check --output json
      - uses: actions/upload-artifact@v4
        with:
          name: cli-distributions
          path: .runtime/ci/cli-dist/
          retention-days: 7
          if-no-files-found: error
