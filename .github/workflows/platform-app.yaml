name: platform app
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ACCESS_TEST_DSN: host=127.0.0.1 port=5432 user=postgres dbname=postgres
      ACCESS_FIXTURE_TEST_DSN: host=127.0.0.1 port=5432 user=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r platform/tests/requirements.txt
      - run: python3 -m unittest discover -s platform/tests -v
      - run: python3 -m compileall -q platform/app platform/acceptance scripts/check-hosted-access.py
      - name: Verify offline acceptance plan
        run: >-
          python3 scripts/check-hosted-access.py plan --run-id 0123456789ab
          --fixture-image ghcr.io/example/fixture@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - name: Build neutral acceptance fixture
        run: docker build -f platform/acceptance/Dockerfile.fixture -t acceptance-fixture:test platform/acceptance
      - name: Start isolated identity provider
        run: >-
          docker run --rm -d --name access-test-keycloak
          -p 127.0.0.1:18080:8080
          -e KC_BOOTSTRAP_ADMIN_USERNAME=test-admin
          -e KC_BOOTSTRAP_ADMIN_PASSWORD=test-only-password
          quay.io/keycloak/keycloak:26.4.1 start-dev
      - name: Wait for test identity provider
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/realms/master/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify real hosted identities and proxy configuration
        env:
          ACCESS_TEST_KEYCLOAK_URL: http://127.0.0.1:18080
          ACCESS_PROXY_CONFIG_TEST: "1"
        run: python3 -m unittest discover -s platform/tests -p test_application_access_keycloak.py -v
      - name: Remove disposable identity provider
        if: always()
        run: docker stop access-test-keycloak || true
