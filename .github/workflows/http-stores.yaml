name: HTTP data stores
on: [push, pull_request]

jobs:
  http-consoles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project platform/app --locked
      - run: npm ci --prefix platform/ui
      - run: npx playwright install --with-deps chromium
        working-directory: platform/ui
      - run: docker build --target store-console-export --output type=local,dest=/tmp/platform-store-consoles platform
      - run: STORE_CONSOLE_FIXTURE=1 STORE_RUSTFS_CONSOLE_DIR=/tmp/platform-store-consoles/rustfs uv run --project platform/app python scripts/verify-shared-store-compose.py

  opensearch-console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project platform/app --locked
      - run: sudo apt-get update && sudo apt-get install -y acl
      - run: npm ci --prefix platform/ui
      - run: npx playwright install --with-deps chromium
        working-directory: platform/ui
      - name: Pull pinned server and console images
        run: |
          uv run --project platform/app python - <<'PY'
          import subprocess, yaml
          config = yaml.safe_load(open('persistence/shared-stores.yaml'))
          for name in ('opensearch', 'opensearch-dashboards'):
              subprocess.run(['docker', 'pull', config['services'][name]['image']], check=True)
          PY
      - run: STORE_DASHBOARDS_FIXTURE=1 uv run --project platform/app python scripts/verify-shared-store-compose.py

  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project platform/app --locked
      - run: sudo apt-get update && sudo apt-get install -y acl
      - name: Pull pinned native images before private configuration preparation
        run: |
          uv run --project platform/app python - <<'PY'
          import subprocess, yaml
          config = yaml.safe_load(open('persistence/shared-stores.yaml'))
          for name in ('rustfs', 'qdrant', 'opensearch'):
              subprocess.run(['docker', 'pull', config['services'][name]['image']], check=True)
          PY
      - run: uv run --project platform/app python scripts/verify-shared-store-compose.py
      - run: uv run --project platform/app python scripts/verify-opensearch-tls.py

  rustfs-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project platform/app --group analytics-fixtures --locked
      - run: docker pull rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
      - run: STORE_ANALYTICS_FIXTURE=1 uv run --project platform/app --group analytics-fixtures python scripts/verify-rustfs.py

  qdrant-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project platform/app --locked
      - run: docker pull qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
      - run: uv run --project platform/app python scripts/verify-qdrant.py

  opensearch-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project platform/app --locked
      - run: docker pull opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
      - run: uv run --project platform/app python scripts/verify-opensearch.py
