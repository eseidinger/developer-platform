name: ui
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/ui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/ui/package-lock.json
      - run: npm ci
      - run: npm run check
