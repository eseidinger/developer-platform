name: hosted access fixture

on:
  push:
    tags: ["hosted-access-v*"]
  pull_request:
    paths:
      - .github/workflows/hosted-access-fixture.yaml
      - platform/acceptance/**
      - platform/app/tests/test_hosted_access_acceptance.py
      - platform/app/pyproject.toml
      - platform/app/uv.lock
      - scripts/tests/platform/check-hosted-access.py
      - scripts/release/hosted-access-release.py
      - scripts/tests/unit/test_hosted_access_workflow.py

permissions:
  contents: read

concurrency:
  group: hosted-access-fixture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test harness and fixture before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ACCESS_FIXTURE_TEST_DSN: host=127.0.0.1 port=5432 user=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v7
      - name: Install test dependencies
        run: uv sync --project platform/app --locked
      - name: Validate release metadata and workflow safety
        run: >-
          uv run --project platform/app python -m unittest discover
          -s scripts/tests/unit -p test_hosted_access_workflow.py -v
      - name: Test harness safety and real fixture PostgreSQL persistence
        run: uv run --project platform/app python -m unittest discover -s platform/app/tests -p test_hosted_access_acceptance.py -v
      - name: Build fixture for runtime smoke test
        run: >-
          docker build -f platform/acceptance/Dockerfile.fixture
          -t hosted-access-fixture:test platform/acceptance
      - name: Start fixture with production filesystem and user restrictions
        run: |
          docker run --detach --name hosted-access-fixture-smoke \
            --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 128m --cpus 0.25 \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres -e PGDATABASE=postgres \
            -e FIXTURE_ROLE=provider -e ACCEPTANCE_RUN_ID=0123456789ab \
            hosted-access-fixture:test
          test "$(docker inspect --format '{{.Config.User}}' hosted-access-fixture-smoke)" = 10001
      - name: Verify container readiness
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Remove disposable smoke-test container
        if: always()
        run: docker rm --force hosted-access-fixture-smoke || true

  publish:
    name: Publish versioned fixture to Docker Hub
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/hosted-access-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dockerhub
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate release tag and Docker Hub configuration
        id: release
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: python3 scripts/release/hosted-access-release.py
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish amd64 and arm64 fixture images
        id: build
        uses: docker/build-push-action@v7
        with:
          context: platform/acceptance
          file: platform/acceptance/Dockerfile.fixture
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.description=Authorization-free synthetic hosted-access acceptance fixture; never use with real data
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=hosted-access-fixture
          cache-to: type=gha,mode=max,scope=hosted-access-fixture
      - name: Verify anonymous access to the published fixture
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          anonymous_config="$(mktemp -d)"
          docker --config "$anonymous_config" manifest inspect "$IMAGE@$DIGEST" > /dev/null
      - name: Report digest-pinned harness input
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Backticks below are literal Markdown, not shell expressions.
          # shellcheck disable=SC2016
          {
            printf 'Published fixture: `%s:%s`\n\n' "$IMAGE" "$VERSION"
            printf 'Use this immutable reference as `--fixture-image`:\n\n'
            printf '```bash\nexport HA_IMAGE=%s@%s\n```\n' "$IMAGE" "$DIGEST"
            printf '\nThis publishes the fixture only; it does not deploy or run acceptance.\n'
          } >> "$GITHUB_STEP_SUMMARY"
