---
name: named stores
"on":
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  postgres-access-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/ui/package-lock.json
      - run: uv sync --project platform/app --group analytics-fixtures --locked
      - run: npm ci --prefix platform/ui
      - run: npx playwright install --with-deps chromium
        working-directory: platform/ui
      - run: sudo apt-get update && sudo apt-get install -y restic
      - uses: actions/checkout@v7.0.1
        with:
          repository: eseidinger/platform-postgres
          path: platform-postgres
      - name: Pull reviewed PostgreSQL extension image
        run: docker pull eseidinger/platform-postgres:18.6-extensions-20261112
      - name: Fetch pinned console fixture images
        run: |
          docker pull quay.io/keycloak/keycloak:26.4.1
          docker pull dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
      - name: Verify isolation, expiry, rotation, SSO, encrypted intent and AGE rebuild
        env:
          NAMED_POSTGRES_IMAGE: eseidinger/platform-postgres:18.6-extensions-20261112
          NAMED_POSTGRES_EXTENSIONS: "1"
          NAMED_POSTGRES_CONSOLE: "1"
          RESTIC_TEST_BINARY: /usr/bin/restic
          STORE_ANALYTICS_FIXTURE: "1"
        run: |
          mkdir -p .runtime/ci
          uv run --project platform/app --group analytics-fixtures python \
            scripts/tests/components/stores/verify-named-postgres.py \
            2>&1 | tee .runtime/ci/postgres-recovery.log
      - name: Verify every advertised PostgreSQL extension and dump/restore
        env:
          NAMED_POSTGRES_IMAGE: eseidinger/platform-postgres:18.6-extensions-20261112
          DEVELOPER_PLATFORM_ROOT: ${{ github.workspace }}
        run: |
          uv run --project platform/app python \
            platform-postgres/tests/verify-postgres-extension-expansion.py \
            2>&1 | tee .runtime/ci/postgres-extensions.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: postgres-failure
          path: |
            .runtime/ci/
            platform/ui/test-results/
          retention-days: 7
          if-no-files-found: ignore
