---
- name: >-
    Accept deny-by-default and explicitly approved component egress
  hosts: localhost
  gather_facts: false
  vars:
    # Pin the same BusyBox 1.36.1 image used by the protected acceptance
    # environment, so this network-policy drill does not depend on a tag
    # resolution request before it can exercise egress.
    platform_egress_drill_image: "busybox@sha256:73aaf090f3d85aa34ee199857f03fa\
      3a95c8ede2ffd4cc2cdb5b94e566b11662"
    # Cloudflare's public DNS-over-TLS listener. These defaults are deliberately
    # narrow and exist only during this disposable acceptance drill. Callers can
    # override all three target values with a listener they control.
    platform_egress_target_host: 1.1.1.1
    platform_egress_target_cidr: 1.1.1.1/32
    platform_egress_target_port: 853
    platform_egress_denied_cidr: 192.0.2.1/32
    platform_egress_denied_port: 9
    platform_egress_drill_install_dir: /opt/developer-platform
    platform_egress_drill_host: >-
      {{ (groups.get('developer_platform', []) | first) | default('') }}
  tasks:

    - name: >-
        Require protected runner configuration and explicit egress-drill inputs
      ansible.builtin.assert:
        that:
          - platform_allow_egress_drill | default(false) | bool
          - >-
              platform_egress_drill_acknowledgement | default('') ==
              'I_ACCEPT_EGRESS_DRILL'
          - platform_api_url is defined
          - platform_oidc_token_url is defined
          - platform_test_runner_client_id is defined
          - platform_test_runner_client_secret is defined
          - platform_egress_drill_host | length > 0
          - platform_egress_drill_install_dir | length > 0
          - >-
            platform_egress_target_host is match('^[A-Za-z0-9][A-Za-z0-9.:-]*$')
          - >-
            platform_egress_target_cidr is match('^[0-9a-fA-F:.]+/[0-9]+$')
          - platform_egress_target_port | int >= 1
          - platform_egress_target_port | int <= 65535
          - >-
            platform_egress_denied_cidr is match('^[0-9a-fA-F:.]+/[0-9]+$')
          - platform_egress_denied_port | int >= 1
          - platform_egress_denied_port | int <= 65535
          - >-
              platform_egress_denied_cidr != platform_egress_target_cidr or
              platform_egress_denied_port | int != platform_egress_target_port |
              int
        fail_msg: >-
          Supply the protected runner configuration, normal platform inventory
          host, and explicit acknowledgement. The playbook applies exactly the
          target CIDR and TCP port temporarily, then restores the original
          environment.
      no_log: true

    - name: >-
        Read the exact platform environment before temporary egress enablement
      ansible.builtin.slurp:
        src: "{{ platform_egress_drill_install_dir }}/.env"
      delegate_to: "{{ platform_egress_drill_host }}"
      become: true
      register: egress_original_environment
      no_log: true

    - name: Establish a unique disposable egress project
      ansible.builtin.set_fact:
        egress_project: >-
          {{ platform_egress_project | default('egress-' + lookup('pipe',
          'date +%s') + '-' + (9999 | random | string)) }}

    - name: Require a valid generated egress project name
      ansible.builtin.assert:
        that: >-
          egress_project is match('^(?:[a-z]|[a-z][a-z0-9-]{0,30}[a-z0-9])$')


    - name: Reset cleanup ownership for this run
      ansible.builtin.set_fact:
        platform_cleanup_project_creation: {}
        platform_cleanup_personas: {}
        platform_cleanup_credentials: {}
        platform_cleanup_restoration_ok: true
      no_log: true

    - name: Exercise egress policy with a disposable project
      block:

        - name: >-
            Temporarily isolate egress validation from unrelated admission
            policy
          ansible.builtin.lineinfile:
            path: "{{ platform_egress_drill_install_dir }}/.env"
            regexp: "^{{ item.key }}="
            line: "{{ item.key }}={{ item.value }}"
            create: false
            owner: root
            group: root
            mode: '0600'
          loop:
            - key: ALLOWED_EGRESS_CIDRS
              value: "{{ platform_egress_target_cidr }}"
            - key: ALLOWED_EGRESS_PORTS
              value: "{{ platform_egress_target_port }}"
            - key: CAPACITY_ADMISSION_ENABLED
              value: 'false'
          delegate_to: "{{ platform_egress_drill_host }}"
          become: true
          no_log: true

        - name: >-
            Recreate only the Platform API with temporary egress policy
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - up
              - -d
              - --force-recreate
              - --wait
              - --wait-timeout
              - '120'
              - platform-api
            chdir: "{{ platform_egress_drill_install_dir }}"
          delegate_to: "{{ platform_egress_drill_host }}"
          become: true
          changed_when: true

        - name: >-
            Exchange the runner credential after temporary API recreation
          ansible.builtin.uri:
            url: "{{ platform_oidc_token_url }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ platform_test_runner_client_id }}"
              client_secret: "{{ platform_test_runner_client_secret }}"
            status_code: 200
          register: egress_runner_token
          no_log: true

        - name: Create the disposable egress project
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects"
            method: POST
            headers:
              Authorization: >-
                Bearer {{ egress_runner_token.json.access_token }}
            body_format: json
            body:
              name: "{{ egress_project }}"
            status_code: 201
          register: platform_cleanup_project_creation
          no_log: true

        - name: >-
            Require an unapproved destination to be rejected before side effects
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ egress_project }}"
            method: PUT
            headers:
              Authorization: >-
                Bearer {{ egress_runner_token.json.access_token }}
            body_format: json
            body:
              apiVersion: platform.example/v1alpha2
              kind: Application
              metadata:
                name: "{{ egress_project }}"
              spec:
                components:
                  - name: probe
                    type: service
                    runtime:
                      type: container
                      image: "{{ platform_egress_drill_image }}"
                    outbound:
                      - cidr: "{{ platform_egress_denied_cidr }}"
                        port: "{{ platform_egress_denied_port | int }}"
            status_code: 422
          register: egress_denial
          failed_when: >-
            egress_denial.json.code | default('') != 'policy_denied'
          no_log: true

        - name: Deploy a probe with no external egress permission
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ egress_project }}"
            method: PUT
            headers:
              Authorization: >-
                Bearer {{ egress_runner_token.json.access_token }}
            body_format: json
            body:
              apiVersion: platform.example/v1alpha2
              kind: Application
              metadata:
                name: "{{ egress_project }}"
              spec:
                components:
                  - name: probe
                    type: service
                    runtime:
                      type: container
                      image: "{{ platform_egress_drill_image }}"
                      command: [/bin/sh, -ec]
                      args: ["exec httpd -f -p 8080"]
                    ports:
                      - name: http
                        protocol: http
                        port: 8080
            status_code: 202
          register: egress_unapproved_deployment
          no_log: true

        - name: Wait for the probe without external permission
          ansible.builtin.uri:
            url: >-
              {{ platform_api_url }}{{
              egress_unapproved_deployment.json.status_url }}
            headers:
              Authorization: >-
                Bearer {{ egress_runner_token.json.access_token }}
            status_code: 200
          register: egress_unapproved_operation
          until:
            - egress_unapproved_operation.json.state == 'succeeded'
            - egress_unapproved_operation.json.readiness.state == 'ready'
          retries: 60
          delay: 5
          no_log: true

        - name: Prove an actual external connection is blocked before approval
          ansible.builtin.command:
            argv:
              - >-
                {{ platform_egress_drill_install_dir }}/.runtime/bin/kubectl
              - --kubeconfig
              - >-
                {{ platform_egress_drill_install_dir
                }}/.runtime/admin.kubeconfig
              - -n
              - "project-{{ egress_project }}"
              - exec
              - deployment/probe
              - --
              - /bin/sh
              - -ec
              - >-
                  command -v nc >/dev/null;
                  if nc -z -w 5 {{ platform_egress_target_host }}
                  {{ platform_egress_target_port | int }};
                  then echo EGRESS_ALLOWED; else echo EGRESS_DENIED; fi
          delegate_to: "{{ platform_egress_drill_host }}"
          become: true
          register: egress_denied_connection
          # Allow the node's NetworkPolicy rules to converge before observing
          # denial; the later allowed connection supplies the positive control.
          until: >-
            egress_denied_connection.rc == 0 and
            egress_denied_connection.stdout | trim == 'EGRESS_DENIED'
          retries: 12
          delay: 2
          changed_when: false
          failed_when: >-
            egress_denied_connection.rc != 0 or
            egress_denied_connection.stdout | trim != 'EGRESS_DENIED'

        - name: >-
            Deploy a service whose startup requires approved connectivity
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ egress_project }}"
            method: PUT
            headers:
              Authorization: >-
                Bearer {{ egress_runner_token.json.access_token }}
            body_format: json
            body:
              apiVersion: platform.example/v1alpha2
              kind: Application
              metadata:
                name: "{{ egress_project }}"
              spec:
                components:
                  - name: probe
                    type: service
                    runtime:
                      type: container
                      image: "{{ platform_egress_drill_image }}"
                      command:
                        - /bin/sh
                        - -ec
                      args:
                        - >-
                            nc -z -w 10 {{ platform_egress_target_host }} {{
                            platform_egress_target_port | int }}; exec httpd -f
                            -p 8080
                    ports:
                      - name: http
                        protocol: http
                        port: 8080
                    outbound:
                      - cidr: "{{ platform_egress_target_cidr }}"
                        port: "{{ platform_egress_target_port | int }}"
            status_code:
              - 202
              - 422
              - 503
            return_content: true
          register: egress_deployment
          failed_when: false
          no_log: true

        - name: Require the approved egress deployment to be accepted
          ansible.builtin.assert:
            that: egress_deployment.status | int == 202
            fail_msg: >-
              The approved egress deployment was rejected before a workload was
              created (HTTP {{ egress_deployment.status }}): {{
              egress_deployment.get('json', {}).get('detail',
              egress_deployment.get('json', {}).get('code',
              'no safe API reason supplied')) }}

        - name: Wait for the approved-connectivity workload
          ansible.builtin.uri:
            url: >-
              {{ platform_api_url }}{{ egress_deployment.json.status_url }}
            headers:
              Authorization: >-
                Bearer {{ egress_runner_token.json.access_token }}
            status_code: 200
          register: egress_operation
          until:
            - >-
              (egress_operation.json.state | default('')) == 'succeeded'
            - >-
              (egress_operation.json.readiness.state | default('')) == 'ready'
          retries: 60
          delay: 5
          no_log: true
      always:

        - name: Restore the exact original platform environment
          failed_when: false
          ansible.builtin.copy:
            content: "{{ egress_original_environment.content | b64decode }}"
            dest: "{{ platform_egress_drill_install_dir }}/.env"
            owner: root
            group: root
            mode: '0600'
          delegate_to: "{{ platform_egress_drill_host }}"
          become: true
          when: egress_original_environment is defined
          register: platform_restore_1
          no_log: true

        - name: >-
            Recreate only the Platform API with its original egress policy
          failed_when: false
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - up
              - -d
              - --force-recreate
              - --wait
              - --wait-timeout
              - '120'
              - platform-api
            chdir: "{{ platform_egress_drill_install_dir }}"
          delegate_to: "{{ platform_egress_drill_host }}"
          become: true
          register: platform_restore_2
          changed_when: true
          when: egress_original_environment is defined


        - name: Select confirmed fixture ownership for cleanup
          ansible.builtin.set_fact:
            platform_cleanup_project_creation: >-
              {{ platform_cleanup_project_creation | default({}) }}
            platform_cleanup_restoration_ok: >-
              {{ (platform_restore_1.get('checksum', '') | length > 0) and
              (platform_restore_2.get('rc', -1) == 0) }}
            platform_cleanup_personas: {}
            platform_cleanup_credentials: []
          no_log: true

        - name: Clean owned fixtures and require complete cleanup
          ansible.builtin.import_tasks: ../../tasks/tests/support/cleanup.yml

    - name: Report non-secret egress-policy evidence
      ansible.builtin.debug:
        msg: >-
          PASS: {{ egress_project }} rejected an unapproved declaration, blocked
          the actual connection before permission, and became ready after
          connecting to {{ platform_egress_target_host
          }}:{{ platform_egress_target_port }} through a temporary approved {{
          platform_egress_target_cidr }} policy; the original Platform API
          environment was restored during cleanup.
