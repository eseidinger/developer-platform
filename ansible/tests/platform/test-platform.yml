---
- name: Test the platform with short-lived automation personas
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    platform_test_image: hashicorp/http-echo:1.0.0
  tasks:

    - name: Require protected test-runner configuration
      ansible.builtin.assert:
        that:
          - platform_api_url is defined
          - platform_oidc_token_url is defined
          - platform_test_runner_client_id is defined
          - platform_test_runner_client_secret is defined
        fail_msg: >-
          Supply the protected output produced by
          bootstrap-platform-test-runner.yml.
      no_log: true

    - name: Establish unique disposable resource names
      ansible.builtin.set_fact:
        test_run_id: >-
          {{ platform_test_run_id | default('run-' +
          ansible_facts['date_time']['epoch']) }}
        test_project: >-
          {{ platform_test_project | default('test-' +
          ansible_facts['date_time']['epoch']) }}
        forbidden_project: >-
          {{ platform_forbidden_project | default('test-denied-' +
          ansible_facts['date_time']['epoch']) }}

    - name: >-
        Exchange the reusable runner secret for a short-lived token
      ansible.builtin.uri:
        url: "{{ platform_oidc_token_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ platform_test_runner_client_id }}"
          client_secret: "{{ platform_test_runner_client_secret }}"
        status_code: 200
      register: runner_token_response
      no_log: true

    - name: >-
        Verify the platform administrator can inspect Kubernetes capacity and
        node usage
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/operator/capacity"
        headers:
          Authorization: "Bearer {{ runner_token_response.json.access_token }}"
        status_code: 200
      register: capacity_response
      failed_when: >-
        capacity_response.status != 200 or capacity_response.json.state != 'ok'
        or (capacity_response.json.nodes | length) == 0 or
        (capacity_response.json.nodes | selectattr('capacity.cpu', 'undefined')
        | list | length) != 0 or (capacity_response.json.nodes |
        selectattr('allocatable.cpu', 'undefined') | list | length) != 0 or
        (capacity_response.json.nodes | selectattr('usage_state', 'equalto',
        'ok') | list | length) == 0
      no_log: true

    - name: Reset cleanup ownership for this run
      ansible.builtin.set_fact:
        platform_cleanup_project_creation: {}
        platform_cleanup_personas: {}
        platform_cleanup_credentials: {}
        persona_credentials: {}
        deployment_credential: {}
        rotated_credential: {}
        platform_cleanup_restoration_ok: true
      no_log: true

    - name: >-
        Exercise the platform using disposable identities and projects
      block:

        - name: Create disposable identities and verify initial grants
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/platform/identities.yml

        - name: Verify project-scoped CI deployment permissions
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/platform/deployment.yml

        - name: Verify configuration, restart, and rollback permissions
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/platform/configuration.yml

        - name: Verify diagnostics and recovery permissions
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/platform/diagnostics.yml

        - name: Verify credential overlap and immediate revocation
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/platform/credential-rotation.yml
      always:

        - name: Select confirmed fixture ownership for cleanup
          ansible.builtin.set_fact:
            platform_cleanup_project_creation: >-
              {{ platform_cleanup_project_creation | default({}) }}
            platform_cleanup_personas: "{{ persona_credentials | default({}) }}"
            platform_cleanup_credentials: >-
              {{ [{'project': test_project, 'creation': deployment_credential |
              default({})}, {'project': test_project, 'creation':
              rotated_credential | default({})}] }}
          no_log: true

        - name: Clean owned fixtures and require complete cleanup
          ansible.builtin.import_tasks: ../../tasks/tests/support/cleanup.yml
