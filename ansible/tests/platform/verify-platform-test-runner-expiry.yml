---
- name: >-
    Verify a dedicated test-runner credential before or after expiry
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    - name: Require a protected dedicated expiry-drill credential
      ansible.builtin.assert:
        that:
          - platform_api_url is defined
          - platform_oidc_token_url is defined
          - platform_test_runner_client_id is defined
          - platform_test_runner_client_secret is defined
          - platform_test_runner_credential_id is defined
          - platform_test_runner_expires_at is defined
          - platform_expiry_drill_phase is defined
          - platform_expiry_drill_phase in ['active', 'expired']
        fail_msg: >-
          Supply the protected dedicated runner configuration and set
          platform_expiry_drill_phase to active or expired explicitly.
      no_log: true

    - name: Require a protected evidence path shared by both phases
      ansible.builtin.assert:
        that:
          - platform_expiry_evidence_file is defined
          - platform_expiry_evidence_file.startswith('/')
        fail_msg: >-
          Set platform_expiry_evidence_file in a private controller directory.
          Run active just before credential expiry, then expired while the held
          JWT remains valid. Both phases must use the same credential and file.

    - name: Verify the expiry boundary without exposing credentials
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -m
          - scripts.tests.support.runner_expiry
        chdir: "{{ playbook_dir }}/../../.."
        stdin: >-
          {{ {'phase': platform_expiry_drill_phase,
              'api': platform_api_url, 'token_url': platform_oidc_token_url,
              'client_id': platform_test_runner_client_id,
              'client_secret': platform_test_runner_client_secret,
              'credential_id': platform_test_runner_credential_id,
              'expires_at': platform_test_runner_expires_at,
              'state_file': platform_expiry_evidence_file} | to_json }}
      changed_when: platform_expiry_drill_phase == 'active'
      no_log: true

    - name: Report non-secret expiry-drill evidence
      ansible.builtin.debug:
        msg: >-
          PASS: dedicated runner {{ platform_test_runner_credential_id }}
          passed {{ platform_expiry_drill_phase }} boundary checks. The held
          JWT outlives credential expiry; evidence remains private.
