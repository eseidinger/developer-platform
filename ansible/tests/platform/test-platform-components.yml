---
- name: >-
    Accept the multi-service and scheduled-component platform contract
  hosts: localhost
  gather_facts: true
  vars:
    platform_component_service_image: hashicorp/http-echo:1.0.0
    platform_component_job_image: busybox:1.36
    platform_component_drill_host: platform
    platform_component_kubectl: /opt/developer-platform/.runtime/bin/kubectl
    platform_component_kubeconfig: >-
      /opt/developer-platform/.runtime/admin.kubeconfig
    platform_component_drill_become: false
  tasks:

    - name: >-
        Require protected runner configuration and a platform inventory host
      ansible.builtin.assert:
        that:
          - platform_api_url is defined
          - platform_oidc_token_url is defined
          - platform_test_runner_client_id is defined
          - platform_test_runner_client_secret is defined
          - platform_component_drill_host in groups['all']
        fail_msg: >-
          Supply the protected test-runner configuration and run with the normal
          platform inventory so read-only Kubernetes checks can be delegated to
          the platform host.
      no_log: true

    - name: Establish a unique disposable component project
      ansible.builtin.set_fact:
        component_run_id: >-
          {{ platform_component_test_run_id | default('components-' +
          ansible_facts['date_time']['epoch']) }}
        component_project: >-
          {{ platform_component_test_project | default('components-' +
          ansible_facts['date_time']['epoch']) }}

    - name: >-
        Inspect the configured kubectl executable on the delegated platform host
      ansible.builtin.stat:
        path: "{{ platform_component_kubectl }}"
      delegate_to: "{{ platform_component_drill_host }}"
      register: platform_component_kubectl_stat
      changed_when: false

    - name: >-
        Require an executable kubectl binary on the delegated platform host
      ansible.builtin.assert:
        that:
          - platform_component_kubectl_stat.stat.exists
          - platform_component_kubectl_stat.stat.isreg
          - platform_component_kubectl_stat.stat.executable
        fail_msg: >-
          The configured kubectl executable {{ platform_component_kubectl }} is
          not an executable regular file on delegated host {{
          platform_component_drill_host }}.

    - name: Verify the delegated platform host can execute kubectl
      ansible.builtin.command:
        argv:
          - "{{ platform_component_kubectl }}"
          - version
          - --client
      delegate_to: "{{ platform_component_drill_host }}"
      register: platform_component_kubectl_version
      changed_when: false

    - name: >-
        Exchange the reusable runner secret for a short-lived token
      ansible.builtin.uri:
        url: "{{ platform_oidc_token_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ platform_test_runner_client_id }}"
          client_secret: "{{ platform_test_runner_client_secret }}"
        status_code: 200
      register: component_runner_token
      no_log: true

    - name: >-
        Exercise the component contract with a disposable project
      block:

        - name: Prepare identities and legacy migration inputs
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/components/project-and-migration.yml

        - name: >-
            Reject invalid component declarations before side effects
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/components/validation.yml

        - name: Deploy and inspect the component topology
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/components/rollout.yml

        - name: Verify scheduled success and safe failure
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/components/scheduled-execution.yml

        - name: Verify scoped logs and resource inventory
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/components/logs-and-inventory.yml

        - name: Verify an isolated service update
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/components/service-update.yml

        - name: Verify an isolated scheduled-component update
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/components/scheduled-update.yml

        - name: Verify history, rollback, and retirement scope
          ansible.builtin.import_tasks: >-
            ../../tasks/tests/components/history-and-rollback.yml
      always:

        - name: >-
            Refresh the runner token before disposable-project cleanup
          ansible.builtin.uri:
            url: "{{ platform_oidc_token_url }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ platform_test_runner_client_id }}"
              client_secret: "{{ platform_test_runner_client_secret }}"
            status_code: 200
          register: component_cleanup_runner_token
          failed_when: false
          no_log: true

        - name: Retire the disposable component project
          ansible.builtin.uri:
            url: >-
              {{ platform_api_url }}/projects/{{ component_project
              }}/retirement-preview
            headers:
              Authorization: >-
                Bearer {{ component_cleanup_runner_token.json.access_token }}
            status_code:
              - 200
              - 404
          register: component_cleanup_preview
          failed_when: false
          no_log: true

        - name: Confirm disposable component project retirement
          ansible.builtin.uri:
            url: >-
              {{ platform_api_url }}/projects/{{ component_project }}/retire
            method: POST
            headers:
              Authorization: >-
                Bearer {{ component_cleanup_runner_token.json.access_token }}
            body_format: json
            body:
              confirm_name: "{{ component_project }}"
              scope_token: "{{ component_cleanup_preview.json.scope_token }}"
            status_code:
              - 200
              - 202
              - 404
              - 409
          register: component_cleanup
          until: component_cleanup.status != 202
          # Namespace garbage collection is asynchronous; allow the same bounded
          # window used
          # for workload operations before recording an incomplete cleanup.
          retries: 60
          delay: 5
          failed_when: false
          when: >-
            component_cleanup_preview.status | default(0) | int == 200
          no_log: true

        - name: Revoke the disposable component administrator persona
          ansible.builtin.uri:
            url: >-
              {{ platform_api_url }}/platform/test-identities/{{
              component_admin_credential.json.credential_id }}
            method: DELETE
            headers:
              Authorization: >-
                Bearer {{ component_cleanup_runner_token.json.access_token }}
            status_code:
              - 200
              - 202
              - 404
          failed_when: false
          when: component_admin_credential is defined
          no_log: true
