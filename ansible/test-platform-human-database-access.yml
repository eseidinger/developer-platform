---
- name: Plan or run scoped human PostgreSQL access acceptance
  hosts: developer_platform
  gather_facts: false
  become: true
  vars:
    human_database_command: plan
    human_database_install_dir: /opt/developer-platform
    human_database_python: "{{ human_database_install_dir }}/.runtime/acceptance-venv/bin/python"
    human_database_api: http://127.0.0.1:8000
    human_database_bastion_host: 127.0.0.1
    human_database_bastion_port: 2222
  tasks:
    - name: Require unique fixture scope and explicit live authorization
      ansible.builtin.assert:
        that:
          - human_database_command in ['plan', 'run']
          - human_database_run_id is defined
          - human_database_run_id is match('^[0-9a-f]{12}$')
          - human_database_fixture_image is defined
          - human_database_fixture_image is match('^[A-Za-z0-9][A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$')
          - human_database_install_dir.startswith('/') and human_database_install_dir != '/'
          - human_database_bastion_port | int >= 1024
          - human_database_bastion_port | int <= 65535
          - human_database_command == 'plan' or human_database_confirm_environment | default('') == human_database_api
          - human_database_command == 'plan' or human_database_operator_token_file is defined
          - human_database_command == 'plan' or human_database_known_hosts_file is defined
        fail_msg: Supply a unique 12-hex run ID and digest-pinned neutral fixture. Live runs also require the exact API-origin confirmation and protected session/known-hosts paths on the target.

    - name: Invoke the private acceptance runner without passing secret values
      ansible.builtin.command:
        argv: >-
          {{ [human_database_python, 'scripts/check-human-database-access.py', human_database_command,
              '--api', human_database_api, '--run-id', human_database_run_id,
              '--fixture-image', human_database_fixture_image,
              '--bastion-host', human_database_bastion_host,
              '--bastion-port', human_database_bastion_port | string]
            + (['--operator-token-file', human_database_operator_token_file,
                '--known-hosts-file', human_database_known_hosts_file,
                '--confirm-environment', human_database_confirm_environment]
               if human_database_command == 'run' else []) }}
        chdir: "{{ human_database_install_dir }}"
      changed_when: human_database_command == 'run'
      no_log: true

    - name: Locate private evidence without disclosing credentials
      ansible.builtin.debug:
        msg: "{{ 'Offline plan completed; no resources created.' if human_database_command == 'plan' else 'Private report: ' + human_database_install_dir + '/.runtime/human-database-access/' + human_database_run_id + '/report.json. The two fixture projects remain; this does not close Phase 3A acceptance.' }}"
