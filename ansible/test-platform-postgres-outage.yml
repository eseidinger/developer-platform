---
- name: Prove managed PostgreSQL failure and recovery handling on a disposable project
  hosts: localhost
  gather_facts: false
  vars:
    platform_postgres_outage_acknowledgement: ''
    platform_postgres_drill_install_dir: /opt/developer-platform
    platform_postgres_drill_image: hashicorp/http-echo:1.0.0
  tasks:
    - name: Require explicit approval and protected PostgreSQL outage-drill inputs
      ansible.builtin.assert:
        that:
          - platform_allow_postgres_outage_drill | default(false) | bool
          - platform_postgres_outage_acknowledgement == 'I_ACCEPT_POSTGRES_OUTAGE'
          - platform_api_url is defined
          - platform_oidc_token_url is defined
          - platform_test_runner_client_id is defined
          - platform_test_runner_client_secret is defined
          - platform_postgres_drill_host is defined
          - platform_postgres_drill_host in groups['all']
          - platform_postgres_drill_install_dir | length > 1
        fail_msg: >-
          This drill stops PostgreSQL. Supply protected runner configuration, a reachable inventory
          host, and platform_allow_postgres_outage_drill=true with explicit acknowledgement.
      no_log: true

    - name: Establish a unique disposable PostgreSQL outage project
      ansible.builtin.set_fact:
        postgres_drill_run_id: "{{ platform_postgres_drill_run_id | default('postgres-drill-' + lookup('pipe', 'date +%s')) }}"
        postgres_drill_project: "{{ platform_postgres_drill_project | default('pg-drill-' + lookup('pipe', 'date +%s') + '-' + (99999 | random | string)) }}"

    - name: Require a valid generated PostgreSQL outage project name
      ansible.builtin.assert:
        that: postgres_drill_project is match('^(?:[a-z]|[a-z][a-z0-9-]{0,30}[a-z0-9])$')
        fail_msg: Generated PostgreSQL outage project name is not a valid platform project name.

    - name: Exchange the runner credential for a fresh outage-drill token
      ansible.builtin.uri:
        url: "{{ platform_oidc_token_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ platform_test_runner_client_id }}"
          client_secret: "{{ platform_test_runner_client_secret }}"
        status_code: 200
      register: postgres_runner_token
      no_log: true

    - name: Exercise the controlled PostgreSQL outage with disposable identities
      block:
        - name: Create the disposable PostgreSQL outage project
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects"
            method: POST
            headers:
              Authorization: "Bearer {{ postgres_runner_token.json.access_token }}"
            body_format: json
            body: {name: "{{ postgres_drill_project }}"}
            status_code: 201
          no_log: true

        - name: Create a short-lived developer persona for database observation
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/platform/test-identities"
            method: POST
            headers:
              Authorization: "Bearer {{ postgres_runner_token.json.access_token }}"
            body_format: json
            body:
              name: "developer-{{ postgres_drill_run_id }}"
              role: developer
              project: "{{ postgres_drill_project }}"
              test_run_id: "{{ postgres_drill_run_id }}"
              expires_in_hours: 2
            status_code: 201
          register: postgres_developer_credential
          no_log: true

        - name: Exchange the developer persona credential
          ansible.builtin.uri:
            url: "{{ postgres_developer_credential.json.token_endpoint }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ postgres_developer_credential.json.client_id }}"
              client_secret: "{{ postgres_developer_credential.json.client_secret }}"
            status_code: 200
          register: postgres_developer_token
          no_log: true

        - name: Deploy a disposable database-bound workload
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ postgres_drill_project }}"
            method: PUT
            headers:
              Authorization: "Bearer {{ postgres_runner_token.json.access_token }}"
            body_format: json
            body:
              name: "{{ postgres_drill_project }}"
              image: "{{ platform_postgres_drill_image }}"
              port: 5678
              probe_profile: hello-world
            status_code: 202
          register: postgres_workload_deployment
          no_log: true

        - name: Wait for the disposable workload and managed database
          ansible.builtin.uri:
            url: "{{ platform_api_url }}{{ postgres_workload_deployment.json.status_url }}"
            headers:
              Authorization: "Bearer {{ postgres_runner_token.json.access_token }}"
            status_code: 200
          register: postgres_workload_operation
          until:
            - (postgres_workload_operation.json.state | default('')) == 'succeeded'
            - (postgres_workload_operation.json.readiness.state | default('')) == 'ready'
          retries: 60
          delay: 5
          no_log: true

        - name: Require database availability before the outage
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ postgres_drill_project }}/data-services"
            headers: {Authorization: "Bearer {{ postgres_developer_token.json.access_token }}"}
            status_code: 200
          register: postgres_before_outage
          failed_when: postgres_before_outage.json.services[0].state != 'available'
          no_log: true

        - name: Create a developer-visible recovery request before the controlled outage
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ postgres_drill_project }}/data-services/recovery-requests"
            method: POST
            headers: {Authorization: "Bearer {{ postgres_developer_token.json.access_token }}"}
            body_format: json
            body: {reason: unavailable}
            status_code: 201
          register: postgres_recovery_request
          no_log: true

        - name: Run the controlled PostgreSQL outage and restoration sequence
          block:
            - name: Stop PostgreSQL for the approved outage drill
              ansible.builtin.command:
                argv: [docker, compose, stop, postgres]
                chdir: "{{ platform_postgres_drill_install_dir }}"
              delegate_to: "{{ platform_postgres_drill_host }}"
              become: true
              changed_when: true

            - name: Wait for developer-visible managed database unavailability
              ansible.builtin.uri:
                url: "{{ platform_api_url }}/projects/{{ postgres_drill_project }}/data-services"
                headers: {Authorization: "Bearer {{ postgres_developer_token.json.access_token }}"}
                status_code: 200
              register: postgres_during_outage
              until: postgres_during_outage.json.services[0].state == 'unavailable'
              retries: 20
              delay: 2
              no_log: true

            - name: Require Platform API readiness to fail while PostgreSQL is unavailable
              ansible.builtin.command:
                argv: [curl, --fail, --silent, --show-error, http://127.0.0.1:8000/readyz]
              delegate_to: "{{ platform_postgres_drill_host }}"
              become: true
              register: postgres_outage_readyz
              changed_when: false
              failed_when: postgres_outage_readyz.rc == 0
          always:
            - name: Restore PostgreSQL even if the outage drill fails
              ansible.builtin.command:
                argv: [docker, compose, up, -d, --wait, --wait-timeout, '120', postgres]
                chdir: "{{ platform_postgres_drill_install_dir }}"
              delegate_to: "{{ platform_postgres_drill_host }}"
              become: true
              changed_when: true

        - name: Wait for Platform API readiness after PostgreSQL recovery
          ansible.builtin.command:
            argv: [curl, --fail, --silent, --show-error, http://127.0.0.1:8000/readyz]
          delegate_to: "{{ platform_postgres_drill_host }}"
          become: true
          register: postgres_recovered_readyz
          changed_when: false
          until: postgres_recovered_readyz.rc == 0
          retries: 30
          delay: 2

        - name: Require database availability after recovery
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ postgres_drill_project }}/data-services"
            headers: {Authorization: "Bearer {{ postgres_developer_token.json.access_token }}"}
            status_code: 200
          register: postgres_after_recovery
          until: postgres_after_recovery.json.services[0].state == 'available'
          retries: 30
          delay: 2
          no_log: true

        - name: Resolve the recovery request as platform administrator
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/operator/data-service-recovery-requests/{{ postgres_recovery_request.json.request_id }}"
            method: PATCH
            headers: {Authorization: "Bearer {{ postgres_runner_token.json.access_token }}"}
            body_format: json
            body: {status: resolved}
            status_code: 200
          no_log: true

        - name: Require a redacted developer-visible resolved recovery outcome
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ postgres_drill_project }}/data-services"
            headers: {Authorization: "Bearer {{ postgres_developer_token.json.access_token }}"}
            status_code: 200
          register: postgres_recovery_outcome
          failed_when: >-
            postgres_recovery_outcome.json.services[0].state != 'available' or
            postgres_recovery_outcome.json.latest_recovery_request.status != 'resolved' or
            postgres_recovery_outcome.json | to_json is search('password|PGPASSWORD')
          no_log: true
      always:
        - name: Refresh the runner token before disposable-project cleanup
          ansible.builtin.uri:
            url: "{{ platform_oidc_token_url }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ platform_test_runner_client_id }}"
              client_secret: "{{ platform_test_runner_client_secret }}"
            status_code: 200
          register: postgres_cleanup_runner_token
          failed_when: false
          no_log: true

        - name: Read the disposable project's retirement scope for cleanup
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ postgres_drill_project }}/retirement-preview"
            headers: {Authorization: "Bearer {{ postgres_cleanup_runner_token.json.access_token }}"}
            status_code: [200, 404]
          register: postgres_cleanup_preview
          failed_when: false
          no_log: true

        - name: Retire the disposable PostgreSQL outage project
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ postgres_drill_project }}/retire"
            method: POST
            headers: {Authorization: "Bearer {{ postgres_cleanup_runner_token.json.access_token }}"}
            body_format: json
            body:
              confirm_name: "{{ postgres_drill_project }}"
              scope_token: "{{ postgres_cleanup_preview.json.scope_token }}"
            status_code: [200, 202, 404, 409]
          register: postgres_cleanup
          until: postgres_cleanup.status != 202
          retries: 60
          delay: 5
          failed_when: false
          when: postgres_cleanup_preview.status | default(0) | int == 200
          no_log: true

        - name: Revoke the disposable PostgreSQL outage developer persona
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/platform/test-identities/{{ postgres_developer_credential.json.credential_id }}"
            method: DELETE
            headers: {Authorization: "Bearer {{ postgres_cleanup_runner_token.json.access_token }}"}
            status_code: [200, 202, 404]
          failed_when: false
          when: postgres_developer_credential is defined
          no_log: true

    - name: Report non-secret PostgreSQL outage-drill evidence
      ansible.builtin.debug:
        msg: >-
          PASS: {{ postgres_drill_project }} exposed PostgreSQL unavailability, recovered API and
          database readiness, and a resolved developer-visible recovery outcome.
