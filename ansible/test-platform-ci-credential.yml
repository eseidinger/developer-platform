---
- name: Test revocable CI deployment credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    platform_test_project: ci-token-test
    platform_test_credential: acceptance-pipeline
    platform_test_image: hashicorp/http-echo:1.0.0
  tasks:
    - name: Require protected test inputs
      ansible.builtin.assert:
        that:
          - platform_api_url is defined
          - platform_project_admin_token is defined
          - platform_forbidden_project is defined
        fail_msg: Supply platform_api_url, platform_project_admin_token, and an existing platform_forbidden_project.
      no_log: true

    - name: Reconcile the existing disposable test project
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects/{{ platform_test_project }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ platform_project_admin_token }}"
        body_format: json
        body:
          name: "{{ platform_test_project }}"
          image: "{{ platform_test_image }}"
          port: 5678
          probe_profile: hello-world
        status_code: 202
      register: initial_deploy
      no_log: true

    - name: Create a project-scoped deployment credential
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects/{{ platform_test_project }}/deployment-credentials"
        method: POST
        headers:
          Authorization: "Bearer {{ platform_project_admin_token }}"
        body_format: json
        body:
          name: "{{ platform_test_credential }}"
          expires_in_days: 1
        status_code: 201
      register: credential
      no_log: true

    - name: Exchange the one-time secret for a short-lived access token
      ansible.builtin.uri:
        url: "{{ credential.json.token_endpoint }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ credential.json.client_id }}"
          client_secret: "{{ credential.json.client_secret }}"
        status_code: 200
      register: oidc_token
      no_log: true

    - name: Deploy through the machine credential
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects/{{ platform_test_project }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ oidc_token.json.access_token }}"
        body_format: json
        body:
          name: "{{ platform_test_project }}"
          image: "{{ platform_test_image }}"
          port: 5678
          probe_profile: hello-world
        status_code: 202
      register: machine_deploy
      no_log: true

    - name: Wait for the machine deployment operation and rollout
      ansible.builtin.uri:
        url: "{{ platform_api_url }}{{ machine_deploy.json.status_url }}"
        headers:
          Authorization: "Bearer {{ oidc_token.json.access_token }}"
        status_code: 200
      register: machine_operation
      until:
        - machine_operation.json.state == 'succeeded'
        - machine_operation.json.readiness.state == 'ready'
      retries: 60
      delay: 5
      no_log: true

    - name: Prove cross-project access is denied
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects/{{ platform_forbidden_project }}/logs"
        headers:
          Authorization: "Bearer {{ oidc_token.json.access_token }}"
        status_code: 403
      no_log: true

    - name: Prove credential administration is denied
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects/{{ platform_test_project }}/deployment-credentials"
        headers:
          Authorization: "Bearer {{ oidc_token.json.access_token }}"
        status_code: 403
      no_log: true

    - name: Prove secret mutation is denied
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects/{{ platform_test_project }}/secrets/CI_FORBIDDEN"
        method: PUT
        headers:
          Authorization: "Bearer {{ oidc_token.json.access_token }}"
        body_format: json
        body:
          value: must-not-be-written
        status_code: 403
      no_log: true

    - name: Revoke the deployment credential
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects/{{ platform_test_project }}/deployment-credentials/{{ credential.json.credential_id }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ platform_project_admin_token }}"
        status_code: [200, 202]
      register: revocation
      no_log: true

    - name: Require completed provider cleanup for acceptance
      ansible.builtin.assert:
        that: revocation.json.status == 'revoked'
        fail_msg: Credential is denied but provider cleanup remains revocation_pending; retry after Keycloak recovers.

    - name: Prove the previously issued token is immediately denied
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects"
        headers:
          Authorization: "Bearer {{ oidc_token.json.access_token }}"
        status_code: 403
      no_log: true

    - name: Report non-secret acceptance result
      ansible.builtin.debug:
        msg: "PASS: CI credential deployed revision {{ machine_deploy.json.revision }}, denied forbidden actions, and was revoked"
