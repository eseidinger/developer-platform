---
- name: Install the restricted human database SSH tunnel
  hosts: developer_platform
  become: true
  gather_facts: true
  vars:
    database_bastion_bind_ip: >-
      {{ platform_database_bastion_bind_ip | default('127.0.0.1') }}
    database_bastion_port: >-
      {{ platform_database_bastion_port | default(2222) | int }}
    database_install_dir: >-
      {{ platform_install_dir | default('/opt/developer-platform') }}


  tasks:

    - name: Validate the deliberately selected listener
      ansible.builtin.assert:
        that:
          - database_bastion_bind_ip is match('^[0-9.]+$')
          - database_bastion_bind_ip != '0.0.0.0'
          - database_bastion_port | int >= 1024
          - database_bastion_port | int <= 65535
        fail_msg: >-
          Set a specific IPv4 bind address and unprivileged port for the
          database bastion.

    - name: >-
        Validate advertised SSH settings against the selected listener
      ansible.builtin.set_fact:
        database_advertised_settings: >-
          {{ database_inventory_options | platform_inventory_settings }}
      vars:
        database_inventory_options:
          store_ssh_host: "{{ platform_store_ssh_host | default(none) }}"
          bastion_bind_ip: "{{ database_bastion_bind_ip }}"
          bastion_port: "{{ platform_database_bastion_port | default(2222) }}"

    - name: Install OpenSSH server and Python
      ansible.builtin.apt:
        name:
          - openssh-server
          - python3
        state: present

    - name: Read the installed platform configuration
      ansible.builtin.slurp:
        src: "{{ database_install_dir }}/.env"
      register: database_environment
      no_log: true

    - name: Extract the bastion token and private database address
      ansible.builtin.set_fact:
        database_bastion_token: >-
          {{ (database_environment.content | b64decode |
          regex_search('(?m)^DATABASE_BASTION_TOKEN=([A-Fa-f0-9]{64})$', '\1'))
          | first | default('') }}
        database_postgres_ip: >-
          {{ (database_environment.content | b64decode |
          regex_search('(?m)^POSTGRES_IP=([0-9.]+)$', '\1')) | first |
          default('') }}
        database_store_relay_ip: >-
          {{ (database_environment.content | b64decode |
          regex_search('(?m)^STORE_RELAY_IP=([0-9.]+)$', '\1')) | default([],
          true) | first | default('172.30.80.15') }}
        database_deployed_ssh_port: >-
          {{ (database_environment.content | b64decode |
          regex_search('(?m)^STORE_SSH_PORT=([0-9]+)$', '\1')) | default([],
          true) | first | default('2222') }}
        database_deployed_ssh_host: >-
          {{ (database_environment.content | b64decode |
          regex_search('(?m)^STORE_SSH_HOST=([^\r\n]*)$', '\1')) | default([],
          true) | first | default('') }}
      no_log: true

    - name: Require generated token and fixed PostgreSQL address
      ansible.builtin.assert:
        that:
          - database_bastion_token is match('^[A-Fa-f0-9]{64}$')
          - database_postgres_ip is match('^[0-9.]+$')
          - database_postgres_ip != '0.0.0.0'
          - database_store_relay_ip is match('^[0-9.]+$')
          - database_store_relay_ip != '0.0.0.0'
          - >-
            database_deployed_ssh_port | int == database_bastion_port | int
          - >-
              platform_store_ssh_host is not defined or
              database_deployed_ssh_host == platform_store_ssh_host
        fail_msg: >-
          Deploy first; require generated credentials, private database/relay
          addresses and a matching advertised SSH port.
      no_log: true

    - name: Create noninteractive forwarding account
      ansible.builtin.user:
        name: platform-db
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        # A leading ! locks the entire SSH account (including public keys).
        # Password authentication is disabled in this daemon; *NP* is an
        # impossible password hash without marking the account locked.
        password: '*NP*'

    - name: Create key lookup account
      ansible.builtin.user:
        name: platform-db-keylookup
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        password_lock: true

    - name: Create private token directory
      ansible.builtin.file:
        path: /etc/developer-platform
        state: directory
        owner: root
        group: platform-db-keylookup
        mode: '0750'

    - name: Install lookup token
      ansible.builtin.copy:
        dest: /etc/developer-platform/db-bastion-token
        content: "{{ database_bastion_token }}\n"
        owner: root
        group: platform-db-keylookup
        mode: '0440'
      no_log: true

    - name: Create helper directory
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install fail-closed authorized-key lookup
      ansible.builtin.copy:
        src: >-
          {{ playbook_dir | dirname | dirname
          }}/scripts/internal/db_authorized_key.py
        dest: /usr/local/libexec/platform-db-authorized-key
        owner: root
        group: root
        mode: '0755'

    - name: Install isolated SSH daemon configuration
      ansible.builtin.template:
        dest: /etc/ssh/sshd_config_platform_db
        owner: root
        group: root
        mode: '0600'
        src: >-
          {{ playbook_dir | dirname }}/templates/database-bastion/sshd_config.j2
      notify: Restart database bastion

    - name: Install dedicated SSH service
      ansible.builtin.template:
        dest: /etc/systemd/system/platform-db-bastion.service
        owner: root
        group: root
        mode: '0644'
        src: >-
          {{ playbook_dir | dirname }}/templates/database-bastion/service.j2
      notify: Restart database bastion

    - name: Enable the dedicated bastion
      ansible.builtin.systemd_service:
        name: platform-db-bastion.service
        enabled: true
        state: started
        daemon_reload: true

  handlers:

    - name: Restart database bastion
      ansible.builtin.systemd_service:
        name: platform-db-bastion.service
        state: restarted
        daemon_reload: true
