---
- name: Plan or run neutral hosted-access acceptance without deploying the platform
  hosts: developer_platform
  gather_facts: false
  become: true
  vars:
    hosted_access_command: plan
    hosted_access_install_dir: /opt/developer-platform
    hosted_access_python: "{{ hosted_access_install_dir }}/.runtime/acceptance-venv/bin/python"
    hosted_access_api: http://127.0.0.1:8000
    hosted_access_issuer: https://identity.example.invalid/realms/platform
    hosted_access_timed: false
    hosted_access_monitoring: false
    hosted_access_prometheus: http://127.0.0.1:9090
    hosted_access_allow_recovery_reconcile: false
  tasks:
    - name: Require exact scope and separate permission for live commands
      ansible.builtin.assert:
        that:
          - hosted_access_command in ['plan', 'run', 'cleanup']
          - hosted_access_run_id is match('^[0-9a-f]{12}$')
          - hosted_access_command == 'cleanup' or hosted_access_fixture_image is match('^[A-Za-z0-9][A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$')
          - hosted_access_command == 'plan' or hosted_access_confirm_environment | default('') == hosted_access_api
          - hosted_access_command == 'plan' or hosted_access_operator_token_file is defined
          - hosted_access_install_dir.startswith('/') and hosted_access_install_dir != '/'
          - hosted_access_apps_domain is defined
        fail_msg: Supply a run ID, digest-pinned image, domain, and explicit live scope. The session file must already exist privately on the target.

    - name: Invoke the harness with paths rather than credential values
      ansible.builtin.command:
        argv: >-
          {{ [hosted_access_python, 'scripts/acceptance/check-hosted-access.py', hosted_access_command,
              '--api', hosted_access_api, '--run-id', hosted_access_run_id,
              '--apps-domain', hosted_access_apps_domain, '--issuer', hosted_access_issuer]
            + (['--fixture-image', hosted_access_fixture_image] if hosted_access_command != 'cleanup' else [])
            + (['--operator-token-file', hosted_access_operator_token_file,
                '--confirm-environment', hosted_access_confirm_environment] if hosted_access_command != 'plan' else [])
            + (['--timed'] if hosted_access_timed | bool else [])
            + (['--monitoring', '--prometheus', hosted_access_prometheus] if hosted_access_monitoring | bool else [])
            + (['--allow-recovery-reconcile'] if hosted_access_allow_recovery_reconcile | bool else []) }}
        chdir: "{{ hosted_access_install_dir }}"
      changed_when: hosted_access_command != 'plan'
      no_log: true

    - name: Locate private run evidence
      ansible.builtin.debug:
        msg: "{{ 'Offline plan completed; no resources created.' if hosted_access_command == 'plan' else 'Private report: ' + hosted_access_install_dir + '/.runtime/hosted-access/' + hosted_access_run_id + '/report.json. This does not close the full acceptance gate.' }}"
