---
all:
  children:
    developer_platform:
      hosts:
        platform:
          ansible_host: 192.0.2.10
          ansible_user: ubuntu
      vars:
        platform_domain: platform.example.com
        platform_apps_domain: apps.example.com
        platform_identity_domain: identity.example.com
        platform_tls_email: admin@example.com
        platform_edge_bind_ip: 0.0.0.0
        platform_image_registries: docker.io,ghcr.io,quay.io  # optional
        platform_drift_scan_interval_seconds: 300  # optional
        platform_revision_retention: 25  # optional
        platform_capacity_admission_enabled: false  # optional; measure reserves before enabling
        platform_capacity_reserve_cpu_millicores: 2000  # optional
        platform_capacity_reserve_memory_mib: 8192  # optional
