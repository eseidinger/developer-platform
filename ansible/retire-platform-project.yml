---
- name: Retire one explicitly confirmed disposable platform project
  hosts: localhost
  gather_facts: false
  vars:
    platform_retire_project_retries: 20
    platform_retire_project_delay_seconds: 2
    platform_retire_verify_credential_revocation: false
  tasks:
    - name: Require protected runner configuration and an exact project confirmation
      ansible.builtin.assert:
        that:
          - platform_api_url is defined
          - platform_oidc_token_url is defined
          - platform_test_runner_client_id is defined
          - platform_test_runner_client_secret is defined
          - platform_retire_project is defined
          - platform_confirm_retire_project is defined
          - platform_confirm_retire_project == platform_retire_project
        fail_msg: >-
          Supply the protected runner configuration, platform_retire_project, and a matching
          platform_confirm_retire_project.
      no_log: true

    - name: Create a disposable credential-revocation probe when explicitly requested
      when: platform_retire_verify_credential_revocation | bool
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects/{{ platform_retire_project }}/deployment-credentials"
        method: POST
        headers:
          Authorization: "Bearer {{ retirement_runner_token.json.access_token }}"
        body_format: json
        body:
          name: "retire-probe-{{ 999999 | random }}"
          expires_in_days: 1
        status_code: 201
      register: retirement_probe
      no_log: true

    - name: Exchange the optional retirement probe credential before retirement
      when: platform_retire_verify_credential_revocation | bool
      ansible.builtin.uri:
        url: "{{ retirement_probe.json.token_endpoint }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ retirement_probe.json.client_id }}"
          client_secret: "{{ retirement_probe.json.client_secret }}"
        status_code: 200
      register: retirement_probe_token
      no_log: true

    - name: Exchange the runner credential for a fresh cleanup token
      ansible.builtin.uri:
        url: "{{ platform_oidc_token_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ platform_test_runner_client_id }}"
          client_secret: "{{ platform_test_runner_client_secret }}"
        status_code: 200
      register: retirement_runner_token
      no_log: true

    - name: Read the exact project retirement scope
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects/{{ platform_retire_project }}/retirement-preview"
        headers:
          Authorization: "Bearer {{ retirement_runner_token.json.access_token }}"
        status_code: 200
      register: retirement_preview
      no_log: true

    - name: Require a scope-bound redacted access and retention inventory
      ansible.builtin.assert:
        that:
          - retirement_preview.json.scope_token is string
          - retirement_preview.json.access.grants_by_role is mapping
          - retirement_preview.json.access.credentials_by_status is mapping
          - retirement_preview.json.retains.catalog_and_revisions | bool
        fail_msg: Retirement preview did not provide the required safe access and retained-data scope.
      no_log: true

    - name: Retire the explicitly confirmed project and its workload resources
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects/{{ platform_retire_project }}/retire"
        method: POST
        headers:
          Authorization: "Bearer {{ retirement_runner_token.json.access_token }}"
        body_format: json
        body:
          confirm_name: "{{ platform_retire_project }}"
          scope_token: "{{ retirement_preview.json.scope_token }}"
        status_code: [200, 202]
      register: project_retirement
      until: project_retirement.status == 200
      retries: "{{ platform_retire_project_retries | int }}"
      delay: "{{ platform_retire_project_delay_seconds | int }}"
      no_log: true

    - name: Require completed project retirement to retain data and revoke project access
      ansible.builtin.assert:
        that:
          - project_retirement.json.data_retained | bool
          - project_retirement.json.status == 'retired'
        fail_msg: Retirement did not complete with the expected retained-data status.
      no_log: true

    - name: Require the optional retired-project credential to be denied
      when: platform_retire_verify_credential_revocation | bool
      ansible.builtin.uri:
        url: "{{ platform_api_url }}/projects"
        headers:
          Authorization: "Bearer {{ retirement_probe_token.json.access_token }}"
        status_code: 403
      no_log: true

    - name: Report non-secret retirement evidence
      ansible.builtin.debug:
        msg: "PASS: disposable project {{ platform_retire_project }} is retired."
