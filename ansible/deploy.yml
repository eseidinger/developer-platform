---
- name: Deploy the developer platform
  hosts: developer_platform
  become: true
  gather_facts: true
  vars:
    platform_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']]
      }}
    platform_settings:
      PLATFORM_DOMAIN: "{{ platform_domain }}"
      APPS_DOMAIN: "{{ platform_apps_domain }}"
      IDENTITY_DOMAIN: "{{ platform_identity_domain }}"
      TLS_EMAIL: "{{ platform_tls_email }}"
      EDGE_BIND_IP: "{{ platform_edge_bind_ip }}"
      IMAGE_REGISTRIES: "{{ platform_image_registries }}"
      DRIFT_SCAN_INTERVAL_SECONDS: "{{ platform_drift_scan_interval_seconds }}"
      REVISION_RETENTION: "{{ platform_revision_retention }}"
      PLATFORM_TRACE_SAMPLE_RATE: "{{ platform_tracing_settings.sample_rate }}"
      CAPACITY_ADMISSION_ENABLED: >-
        {{ (platform_capacity_admission_enabled | bool) | ternary('true',
        'false') }}
      CAPACITY_RESERVE_CPU_MILLICORES: >-
        {{ platform_capacity_reserve_cpu_millicores | int }}
      CAPACITY_RESERVE_MEMORY_MIB: >-
        {{ platform_capacity_reserve_memory_mib | int }}
      CAPACITY_HOST_OVERHEAD_CPU_MILLICORES: >-
        {{ platform_capacity_host_overhead_cpu_millicores | int }}
      CAPACITY_HOST_OVERHEAD_MEMORY_MIB: >-
        {{ platform_capacity_host_overhead_memory_mib | int }}
      CAPACITY_KUBERNETES_OVERHEAD_MEMORY_MIB: >-
        {{ platform_capacity_kubernetes_overhead_memory_mib | int }}
      ALLOWED_EGRESS_CIDRS: "{{ platform_allowed_egress_cidrs }}"
      ALLOWED_EGRESS_PORTS: "{{ platform_allowed_egress_ports }}"

  pre_tasks:

    - name: Validate deployment configuration before host changes
      ansible.builtin.import_tasks: tasks/deploy/preflight.yml
  tasks:

    - name: >-
        Prepare the Docker host and private installation directory
      ansible.builtin.import_tasks: tasks/deploy/host.yml

    - name: Transfer source with guaranteed local archive cleanup
      ansible.builtin.import_tasks: tasks/deploy/source-transfer.yml

    - name: Configure and start the platform
      when: not ansible_check_mode
      block:

        - name: Prepare private runtime configuration
          ansible.builtin.import_tasks: tasks/deploy/environment.yml

        - name: Install checksum-verified cluster tools
          ansible.builtin.import_tasks: tasks/deploy/tools.yml

        - name: Prepare monitoring configuration and bounded storage
          ansible.builtin.import_tasks: tasks/deploy/monitoring-storage.yml

        - name: Check maintenance and store state before the outage
          ansible.builtin.import_tasks: tasks/deploy/maintenance-preflight.yml

        - name: Reconcile services and wait for API readiness
          ansible.builtin.import_tasks: tasks/deploy/startup.yml

        - name: Record source and runtime versions after startup
          ansible.builtin.import_tasks: tasks/deploy/installation-record.yml
