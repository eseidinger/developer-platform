---
- name: Prove revocation fails closed during a controlled identity-provider outage
  hosts: localhost
  gather_facts: false
  vars:
    platform_identity_outage_acknowledgement: ''
    platform_identity_drill_install_dir: /opt/developer-platform
    platform_identity_outage_credential_name: identity-outage-drill
  tasks:
    - name: Require explicit approval and protected outage-drill inputs
      ansible.builtin.assert:
        that:
          - platform_allow_identity_outage_drill | default(false) | bool
          - platform_identity_outage_acknowledgement == 'I_ACCEPT_IDENTITY_OUTAGE'
          - platform_api_url is defined
          - platform_oidc_token_url is defined
          - platform_test_runner_client_id is defined
          - platform_test_runner_client_secret is defined
          - platform_identity_drill_host is defined
          - platform_identity_drill_host in groups['all']
          - platform_identity_drill_install_dir | length > 1
        fail_msg: >-
          This drill stops Keycloak. Supply protected runner configuration, a reachable platform
          inventory host, platform_allow_identity_outage_drill=true, and the acknowledgement.
      no_log: true

    - name: Establish unique disposable identity-outage inputs
      ansible.builtin.set_fact:
        identity_drill_run_id: "identity-drill-{{ lookup('pipe', 'date +%s') }}"
        identity_drill_project: "{{ platform_identity_drill_project | default('id-drill-' + lookup('pipe', 'date +%s') + '-' + (9999 | random | string)) }}"

    - name: Require a valid generated identity-outage project name
      ansible.builtin.assert:
        that: identity_drill_project is match('^(?:[a-z]|[a-z][a-z0-9-]{0,30}[a-z0-9])$')

    - name: Report the non-secret disposable project name
      ansible.builtin.debug:
        msg: "Identity-provider outage drill target: {{ identity_drill_project }}"

    - name: Exchange the runner credential
      ansible.builtin.uri:
        url: "{{ platform_oidc_token_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ platform_test_runner_client_id }}"
          client_secret: "{{ platform_test_runner_client_secret }}"
        status_code: 200
      register: identity_runner_token
      no_log: true

    - name: Exercise the controlled identity-provider outage
      block:
        - name: Create the disposable identity-outage project
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects"
            method: POST
            headers: {Authorization: "Bearer {{ identity_runner_token.json.access_token }}"}
            body_format: json
            body: {name: "{{ identity_drill_project }}"}
            status_code: 201
          no_log: true

        - name: Create a short-lived project administrator persona
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/platform/test-identities"
            method: POST
            headers: {Authorization: "Bearer {{ identity_runner_token.json.access_token }}"}
            body_format: json
            body:
              name: "administrator-{{ identity_drill_run_id }}"
              role: project-admin
              project: "{{ identity_drill_project }}"
              test_run_id: "{{ identity_drill_run_id }}"
              expires_in_hours: 2
            status_code: 201
          register: identity_admin_credential
          no_log: true

        - name: Exchange the project administrator credential
          ansible.builtin.uri:
            url: "{{ identity_admin_credential.json.token_endpoint }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ identity_admin_credential.json.client_id }}"
              client_secret: "{{ identity_admin_credential.json.client_secret }}"
            status_code: 200
          register: identity_admin_token
          no_log: true

        - name: Create a disposable deployment credential
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ identity_drill_project }}/deployment-credentials"
            method: POST
            headers: {Authorization: "Bearer {{ identity_admin_token.json.access_token }}"}
            body_format: json
            body:
              name: "{{ platform_identity_outage_credential_name }}"
              expires_in_days: 1
            status_code: 201
          register: outage_credential
          no_log: true

        - name: Exchange the disposable credential before the outage
          ansible.builtin.uri:
            url: "{{ outage_credential.json.token_endpoint }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ outage_credential.json.client_id }}"
              client_secret: "{{ outage_credential.json.client_secret }}"
            status_code: 200
          register: outage_token
          no_log: true

        - name: Verify disposable credential access before the outage
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects"
            headers: {Authorization: "Bearer {{ outage_token.json.access_token }}"}
            status_code: 200
          no_log: true

        - name: Run controlled Keycloak stop and restoration
          block:
            - name: Stop Keycloak for the approved outage drill
              ansible.builtin.command:
                argv: [docker, compose, stop, keycloak]
                chdir: "{{ platform_identity_drill_install_dir }}"
              delegate_to: "{{ platform_identity_drill_host }}"
              become: true
              changed_when: true

            - name: Revoke the credential while provider cleanup is unavailable
              ansible.builtin.uri:
                url: "{{ platform_api_url }}/projects/{{ identity_drill_project }}/deployment-credentials/{{ outage_credential.json.credential_id }}"
                method: DELETE
                headers: {Authorization: "Bearer {{ identity_admin_token.json.access_token }}"}
                status_code: 202
              register: pending_revocation
              no_log: true

            - name: Require visible pending provider cleanup
              ansible.builtin.assert:
                that: pending_revocation.json.status == 'revocation_pending'
              no_log: true

            - name: Prove the already-issued credential token is immediately denied
              ansible.builtin.uri:
                url: "{{ platform_api_url }}/projects"
                headers: {Authorization: "Bearer {{ outage_token.json.access_token }}"}
                status_code: 403
              no_log: true
          always:
            - name: Restore Keycloak even if the outage drill fails
              ansible.builtin.command:
                argv: [docker, compose, up, -d, --wait, --wait-timeout, '120', keycloak]
                chdir: "{{ platform_identity_drill_install_dir }}"
              delegate_to: "{{ platform_identity_drill_host }}"
              become: true
              changed_when: true

        - name: Refresh the project administrator token after Keycloak recovery
          ansible.builtin.uri:
            url: "{{ identity_admin_credential.json.token_endpoint }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ identity_admin_credential.json.client_id }}"
              client_secret: "{{ identity_admin_credential.json.client_secret }}"
            status_code: 200
          register: identity_recovered_admin_token
          retries: 24
          delay: 5
          until: identity_recovered_admin_token.status | default(0) == 200
          no_log: true

        - name: Retry provider cleanup after Keycloak recovery
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ identity_drill_project }}/deployment-credentials/{{ outage_credential.json.credential_id }}"
            method: DELETE
            headers: {Authorization: "Bearer {{ identity_recovered_admin_token.json.access_token }}"}
            status_code: [200, 202]
          register: completed_revocation
          until:
            - completed_revocation.status == 200
            - completed_revocation.json.status == 'revoked'
          retries: 72
          delay: 5
          no_log: true
      always:
        - name: Refresh runner token before identity-outage cleanup
          ansible.builtin.uri:
            url: "{{ platform_oidc_token_url }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ platform_test_runner_client_id }}"
              client_secret: "{{ platform_test_runner_client_secret }}"
            status_code: 200
          register: identity_cleanup_response
          retries: 24
          delay: 5
          until: identity_cleanup_response.status | default(0) == 200
          failed_when: false
          no_log: true

        - name: Select the identity-outage cleanup token
          ansible.builtin.set_fact:
            identity_cleanup_token: "{{ identity_cleanup_response.get('json', {}).get('access_token', '') }}"
          no_log: true

        - name: Read identity-outage project retirement scope
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ identity_drill_project }}/retirement-preview"
            headers: {Authorization: "Bearer {{ identity_cleanup_token }}"}
            status_code: [200, 404]
          register: identity_cleanup_preview
          failed_when: false
          when: identity_cleanup_token | length > 0
          no_log: true

        - name: Retire the disposable identity-outage project
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ identity_drill_project }}/retire"
            method: POST
            headers: {Authorization: "Bearer {{ identity_cleanup_token }}"}
            body_format: json
            body:
              confirm_name: "{{ identity_drill_project }}"
              scope_token: "{{ identity_cleanup_preview.json.scope_token }}"
            status_code: [200, 202, 404, 409]
          register: identity_cleanup
          until: identity_cleanup.status != 202
          retries: 60
          delay: 5
          failed_when: false
          when:
            - identity_cleanup_token | length > 0
            - identity_cleanup_preview.status | default(0) | int == 200
          no_log: true

        - name: Revoke the disposable project administrator persona
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/platform/test-identities/{{ identity_admin_credential.json.credential_id }}"
            method: DELETE
            headers: {Authorization: "Bearer {{ identity_cleanup_token }}"}
            status_code: [200, 202, 404]
          failed_when: false
          when:
            - identity_admin_credential is defined
            - identity_cleanup_token | length > 0
          no_log: true

    - name: Report non-secret outage-drill evidence
      ansible.builtin.debug:
        msg: >-
          PASS: {{ identity_drill_project }} denied its revoked deployment credential while
          Keycloak was unavailable and completed provider cleanup after recovery.
