---
- name: >-
    Create empty project scopes before any application deployment
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/projects"
    method: POST
    headers:
      Authorization: "Bearer {{ runner_token_response.json.access_token }}"
    body_format: json
    body:
      name: "{{ item }}"
    status_code: 201
  loop:
    - "{{ test_project }}"
    - "{{ forbidden_project }}"
  no_log: true

- name: Create short-lived standard-role test personas
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/platform/test-identities"
    method: POST
    headers:
      Authorization: "Bearer {{ runner_token_response.json.access_token }}"
    body_format: json
    body:
      name: "{{ persona.role }}-{{ test_run_id }}"
      role: "{{ persona.role }}"
      project: "{{ test_project }}"
      test_run_id: "{{ test_run_id }}"
      expires_in_hours: 2
    status_code: 201
  loop:
    - role: viewer
    - role: developer
    - role: project-admin
  loop_control:
    loop_var: persona
  register: persona_credentials
  no_log: true

- name: >-
    Exchange persona credentials for independent access tokens
  ansible.builtin.uri:
    url: "{{ credential.token_endpoint }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ credential.client_id }}"
      client_secret: "{{ credential.client_secret }}"
    status_code: 200
  loop: >-
    {{ persona_credentials.results | map(attribute='json') | list }}
  loop_control:
    loop_var: credential
    label: "{{ credential.role }}"
  register: persona_tokens
  no_log: true

- name: Select role-specific short-lived tokens
  ansible.builtin.set_fact:
    viewer_token: >-
      {{ (persona_tokens.results | selectattr('credential.role', 'equalto',
      'viewer') | first).json.access_token }}
    developer_token: >-
      {{ (persona_tokens.results | selectattr('credential.role', 'equalto',
      'developer') | first).json.access_token }}
    project_admin_token: >-
      {{ (persona_tokens.results | selectattr('credential.role', 'equalto',
      'project-admin') | first).json.access_token }}
  no_log: true

- name: Verify viewer can list only its granted project
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/projects"
    headers:
      Authorization: "Bearer {{ viewer_token }}"
    status_code: 200
  register: viewer_projects
  failed_when: >-
    viewer_projects.status != 200 or (viewer_projects.json |
    map(attribute='name') | list) != [test_project]
  no_log: true

- name: Verify viewer cannot perform the first deployment
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/projects/{{ test_project }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ viewer_token }}"
    body_format: json
    body:
      name: "{{ test_project }}"
      image: "{{ platform_test_image }}"
      port: 5678
      probe_profile: hello-world
    status_code: 403
  no_log: true
