---
- name: Deploy the first application revision
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/projects/{{ rollback_project }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
      If-Match: '"0"'
    body_format: json
    body:
      apiVersion: platform.example/v1alpha2
      kind: Application
      metadata:
        name: "{{ rollback_project }}"
        project: "{{ rollback_project }}"
      spec:
        components:
          - name: web
            type: service
            runtime:
              type: container
              image: "{{ platform_rollback_drill_image }}"
            ports:
              - name: http
                protocol: http
                port: 8080
            replicas: 1
            exposure: private
            bindings:
              - bindingId: "{{ rollback_binding_request.json.grant_id }}"
                envPrefix: ''
            health:
              readiness:
                path: /health/ready
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
        configuration:
          values:
            DEMO_FAIL_READY: 'false'
            ACCEPTANCE_RUN_ID: "{{ rollback_run_id }}"
    status_code: 202
  register: rollback_first_deployment
  no_log: true

- name: Wait for the first application revision
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}{{ rollback_first_deployment.json.status_url }}
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    status_code: 200
  register: rollback_first_operation
  until:
    - >-
      (rollback_first_operation.json.state | default('')) == 'succeeded'
    - >-
      (rollback_first_operation.json.readiness.state | default('')) == 'ready'
  retries: 60
  delay: 5
  no_log: true

- name: >-
    Write the first database-backed visit through the bound workload
  ansible.builtin.command:
    argv:
      - >-
        {{ platform_rollback_drill_install_dir }}/.runtime/bin/kubectl
      - --kubeconfig
      - >-
        {{ platform_rollback_drill_install_dir }}/.runtime/admin.kubeconfig
      - -n
      - "project-{{ rollback_project }}"
      - exec
      - deployment/web
      - --
      - python
      - -c
      - "import json,urllib.request; print(json.load(urllib.request.urlopen('ht\
          tp://127.0.0.1:8080/api/visits',timeout=10))['visits'])"
    chdir: "{{ platform_rollback_drill_install_dir }}"
  delegate_to: "{{ platform_rollback_drill_host }}"
  become: true
  register: rollback_initial_visit
  changed_when: false
  failed_when: >-
    rollback_initial_visit.rc != 0 or rollback_initial_visit.stdout | trim !=
    '1'
  no_log: true

- name: Create the first write-only secret version
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ rollback_project
      }}/secrets/ROLLBACK_PROBE
    method: PUT
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    body_format: json
    body:
      value: "first-{{ rollback_run_id }}"
    status_code: 202
  no_log: true

- name: Wait for first secret activation
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ rollback_project }}/secrets
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    status_code: 200
  register: rollback_first_secret
  until:
    - >-
      (rollback_first_secret.json.activation.state | default('')) == 'active'
    - >-
        rollback_first_secret.json.secrets | selectattr('name', 'equalto',
        'ROLLBACK_PROBE') | list | length == 1
  retries: 60
  delay: 5
  no_log: true

- name: Rotate to the current write-only secret version
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ rollback_project
      }}/secrets/ROLLBACK_PROBE
    method: PUT
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    body_format: json
    body:
      value: "current-{{ rollback_run_id }}"
    status_code: 202
  no_log: true

- name: Wait for rotated secret activation
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ rollback_project }}/secrets
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    status_code: 200
  register: rollback_rotated_secret
  until:
    - >-
      (rollback_rotated_secret.json.activation.state | default('')) == 'active'
    - >-
      rollback_rotated_secret.json.secrets[0].version | int == 2
    - >-
      rollback_rotated_secret.json.secrets[0].state == 'rotating'
  retries: 60
  delay: 5
  no_log: true

- name: Confirm the current secret version
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ rollback_project
      }}/secrets/ROLLBACK_PROBE/confirm
    method: POST
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    status_code: 200
  register: rollback_secret_confirmation
  failed_when: >-
    rollback_secret_confirmation.json.version | int != 2 or
    rollback_secret_confirmation.json.state != 'active'
  no_log: true

- name: >-
    Refresh the runner token before the second revision and rollback
  ansible.builtin.uri:
    url: "{{ platform_oidc_token_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ platform_test_runner_client_id }}"
      client_secret: "{{ platform_test_runner_client_secret }}"
    status_code: 200
  register: rollback_refreshed_runner_token
  no_log: true

- name: Use the refreshed rollback drill token
  ansible.builtin.set_fact:
    rollback_access_token: >-
      {{ rollback_refreshed_runner_token.json.access_token }}
  no_log: true

- name: Deploy a second application revision
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/projects/{{ rollback_project }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
      If-Match: '"{{ rollback_first_deployment.json.revision }}"'
    body_format: json
    body:
      apiVersion: platform.example/v1alpha2
      kind: Application
      metadata:
        name: "{{ rollback_project }}"
        project: "{{ rollback_project }}"
      spec:
        components:
          - name: web
            type: service
            runtime:
              type: container
              image: "{{ platform_rollback_drill_image }}"
            ports:
              - name: http
                protocol: http
                port: 8080
            replicas: 1
            exposure: private
            bindings:
              - bindingId: "{{ rollback_binding_request.json.grant_id }}"
                envPrefix: ''
            health:
              readiness:
                path: /health/ready
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 600m
                memory: 256Mi
        configuration:
          values:
            DEMO_FAIL_READY: 'false'
            ACCEPTANCE_RUN_ID: "{{ rollback_run_id }}"
    status_code: 202
  register: rollback_second_deployment
  no_log: true

- name: Wait for the second application revision
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}{{ rollback_second_deployment.json.status_url }}
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    status_code: 200
  register: rollback_second_operation
  until:
    - >-
      (rollback_second_operation.json.state | default('')) == 'succeeded'
    - >-
      (rollback_second_operation.json.readiness.state | default('')) == 'ready'
  retries: 60
  delay: 5
  no_log: true
