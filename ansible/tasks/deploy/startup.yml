---
- name: Reconcile Compose services and Kubernetes cluster
  ansible.builtin.command:
    argv:
      - python3
      - scripts/operations/deploy-platform.py
      - --readiness-timeout
      - "{{ platform_readiness_timeout_seconds | default(300) | string }}"
    chdir: "{{ platform_install_dir }}"
  changed_when: true
  async: >-
    {{ platform_bootstrap_timeout_seconds | default(3600) }}
  poll: 10
  # Bootstrap can emit Kubernetes token diagnostics on failure.
  no_log: true
