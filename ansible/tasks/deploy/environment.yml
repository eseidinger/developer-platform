---
- name: >-
    Create missing generated secrets without replacing existing values
  ansible.builtin.command:
    argv:
      - python3
      - scripts/init.py
    chdir: "{{ platform_install_dir }}"
  register: platform_environment_init
  changed_when: >-
    'Created .env.' in platform_environment_init.stdout or
    'Added generated values for new required secrets:' in
    platform_environment_init.stdout

- name: Apply shared platform configuration while preserving secrets
  ansible.builtin.command:
    argv:
      - python3
      - scripts/setup/configure-platform.py
      - --stdin
    stdin: "{{ configuration | to_json }}"
    chdir: "{{ platform_install_dir }}"
  vars:
    configuration:
      environment: "{{ platform_validated_environment }}"
      options: "{{ platform_deployment_options }}"
      tracing: "{{ platform_tracing_settings }}"
  register: platform_configuration
  changed_when: >-
    'Platform configuration updated.' in platform_configuration.stdout
  no_log: true
  diff: false

- name: Create private runtime directory
  ansible.builtin.file:
    path: "{{ platform_install_dir }}/.runtime"
    state: directory
    owner: root
    group: root
    mode: '0700'
