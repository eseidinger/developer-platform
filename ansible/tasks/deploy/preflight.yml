---
- name: >-
    Apply defaults only when inventory has not configured them
  ansible.builtin.set_fact:
    platform_install_dir: >-
      {{ platform_install_dir | default('/opt/developer-platform') }}
    platform_source_dir: >-
      {{ platform_source_dir | default(playbook_dir ~ '/..') }}
    platform_domain: "{{ platform_domain | default('platform.localhost') }}"
    platform_apps_domain: >-
      {{ platform_apps_domain | default('apps.localhost') }}
    platform_identity_domain: >-
      {{ platform_identity_domain | default('identity.localhost') }}
    platform_tls_email: >-
      {{ platform_tls_email | default('admin@example.com') }}
    platform_edge_bind_ip: "{{ platform_edge_bind_ip | default('127.0.0.1') }}"
    platform_image_registries: >-
      {{ platform_image_registries | default('docker.io,ghcr.io,quay.io') }}
    platform_drift_scan_interval_seconds: >-
      {{ platform_drift_scan_interval_seconds | default(300) }}
    platform_revision_retention: >-
      {{ platform_revision_retention | default(25) }}
    platform_capacity_admission_enabled: >-
      {{ platform_capacity_admission_enabled | default(false) }}
    platform_capacity_reserve_cpu_millicores: >-
      {{ platform_capacity_reserve_cpu_millicores | default(2000) }}
    platform_capacity_reserve_memory_mib: >-
      {{ platform_capacity_reserve_memory_mib | default(8192) }}
    platform_capacity_host_overhead_cpu_millicores: >-
      {{ platform_capacity_host_overhead_cpu_millicores | default(2000) }}
    platform_capacity_host_overhead_memory_mib: >-
      {{ platform_capacity_host_overhead_memory_mib | default(1024) }}
    platform_capacity_kubernetes_overhead_memory_mib: >-
      {{ platform_capacity_kubernetes_overhead_memory_mib | default(4096) }}
    platform_allowed_egress_cidrs: >-
      {{ platform_allowed_egress_cidrs | default('') }}
    platform_allowed_egress_ports: >-
      {{ platform_allowed_egress_ports | default('') }}
    platform_install_docker: "{{ platform_install_docker | default(true) }}"
    platform_kubectl_version: >-
      {{ platform_kubectl_version | default('v1.36.4') }}

- name: Check supported host and configuration
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - >-
        ansible_facts['distribution_version'] is version('22.04', '>=')
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
      - platform_install_dir.startswith('/')
      - platform_install_dir != '/'
      - >-
        platform_kubectl_version is match('^v1\.(35|36|37)\.[0-9]+$')
      - >-
          (platform_capacity_admission_enabled | string | lower) in ['true',
          'false']
      - >-
        (platform_capacity_reserve_cpu_millicores | string) is match('^[0-9]+$')
      - >-
        (platform_capacity_reserve_memory_mib | string) is match('^[0-9]+$')
      - >-
          (platform_capacity_host_overhead_cpu_millicores | string) is
          match('^[0-9]+$')
      - >-
          (platform_capacity_host_overhead_memory_mib | string) is
          match('^[0-9]+$')
      - >-
          (platform_capacity_kubernetes_overhead_memory_mib | string) is
          match('^[0-9]+$')
      - >-
          (platform_allowed_egress_cidrs | string) is
          match('^$|^[0-9A-Fa-f:.]+/[0-9]{1,3}(?:,[0-9A-Fa-f:.]+/[0-9]{1,3})*$')
      - >-
          (platform_allowed_egress_ports | string) is
          match('^$|^[0-9]+(?:,[0-9]+)*$')
    fail_msg: >-
      Use Ubuntu 22.04 or newer on amd64/arm64 and kubectl compatible with
      Kubernetes 1.36.

- name: >-
    Validate and render explicitly managed deployment options
  ansible.builtin.set_fact:
    platform_managed_settings: >-
      {{ platform_inventory_options | platform_inventory_settings }}
  vars:
    platform_inventory_options:
      stores: "{{ platform_stores | default(none) }}"
      network: "{{ platform_network | default(none) }}"
      search_console_network: >-
        {{ platform_search_console_network | default(none) }}
      k3s_image: "{{ platform_k3s_image | default(none) }}"
      kubectl_version: "{{ platform_kubectl_version }}"
      bootstrap_subject: "{{ platform_bootstrap_subject | default(none) }}"
      store_ssh_host: "{{ platform_store_ssh_host | default(none) }}"
      bastion_bind_ip: "{{ platform_database_bastion_bind_ip | default(none) }}"
      bastion_port: "{{ platform_database_bastion_port | default(none) }}"
      bootstrap_timeout_seconds: >-
        {{ platform_bootstrap_timeout_seconds | default(3600) }}
      readiness_timeout_seconds: >-
        {{ platform_readiness_timeout_seconds | default(300) }}

- name: Validate tracing settings with the selected defaults
  ansible.builtin.set_fact:
    platform_tracing_settings: >-
      {{ platform_trace_options | platform_trace_settings }}
  vars:
    platform_trace_options:
      sample_rate: "{{ platform_trace_sample_rate | default(1.0) }}"
      retention: "{{ platform_trace_retention | default('24h') }}"

- name: >-
    Render Tempo configuration with inventory trace retention
  ansible.builtin.set_fact:
    platform_tempo_configuration: >-
      {{ (lookup('ansible.builtin.file', platform_source_dir ~
      '/infrastructure/monitoring/tempo.yaml') | from_yaml) |
      combine(platform_tempo_retention, recursive=true) }}
  vars:
    platform_tempo_retention:
      backend_worker:
        compaction:
          block_retention: "{{ platform_tracing_settings.retention }}"

- name: Validate environment values
  ansible.builtin.assert:
    that:
      - >-
          item.key in ['ALLOWED_EGRESS_CIDRS', 'ALLOWED_EGRESS_PORTS'] or
          item.value | string is match('^[A-Za-z0-9.@:,_-]+$')
    fail_msg: >-
      Platform settings must be nonempty single-line domain, email, or IP
      values.
  loop: "{{ platform_settings | dict2items }}"
