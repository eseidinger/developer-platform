---
- name: >-
    Transfer deployment sources without local secrets or runtime data
  when: not ansible_check_mode
  block:

    - name: Allocate local source archive
      ansible.builtin.tempfile:
        state: file
        suffix: .tar.gz
      delegate_to: localhost
      become: false
      register: platform_archive

    - name: Package deployment files
      ansible.builtin.command:
        argv:
          - tar
          - --exclude=__pycache__
          - --exclude=*.pyc
          - --exclude=infrastructure/monitoring/private
          - -czf
          - "{{ platform_archive.path }}"
          - -C
          - "{{ platform_source_dir }}"
          - compose.yaml
          - .env.example
          - infrastructure
          - platform
          - scripts
          - tests
          - operations/backup/scripts
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Extract deployment files on the host
      ansible.builtin.unarchive:
        src: "{{ platform_archive.path }}"
        dest: "{{ platform_install_dir }}"
        owner: root
        group: root

    - name: Remove source files retired with PLAN-039
      ansible.builtin.file:
        path: "{{ platform_install_dir }}/{{ item }}"
        state: absent
      loop:
        - platform/app/src/app/stores/bolt_relay.py
        - platform/app/src/app/stores/couchdb.py
        - platform/app/src/app/stores/couchdb_access.py
        - platform/app/src/app/stores/couchdb_console.py
        - platform/app/src/app/stores/dashboards.py
        - platform/app/src/app/stores/hugegraph.py
        - platform/app/src/app/stores/hugegraph_access.py
        - platform/app/src/app/stores/hugegraph_console.py
        - platform/app/src/app/stores/neo4j.py
        - platform/app/src/app/stores/neo4j_controller.py
        - platform/app/src/app/stores/opensearch.py
        - platform/app/src/app/stores/qdrant.py
        - platform/app/src/app/stores/console_assets/couchdb
        - platform/app/src/app/stores/console_assets/hugegraph
        - platform/ui/scripts/verify-deployed-store-consoles.mjs
        - platform/ui/scripts/verify-http-store-consoles.mjs
        - platform/ui/e2e/couchdb-console.spec.ts
        - infrastructure/monitoring/dashboards/neo4j-community.json
        - infrastructure/monitoring/dashboards/opensearch-performance.json
        - infrastructure/monitoring/dashboards/qdrant-performance.json
        - infrastructure/persistence/couchdb.ini
        - infrastructure/persistence/opensearch-bootstrap.sh
        - infrastructure/persistence/opensearch-dashboards.yaml
        - infrastructure/persistence/neo4j
  always:

    - name: Remove local source archive
      ansible.builtin.file:
        path: "{{ platform_archive.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: platform_archive.path is defined
