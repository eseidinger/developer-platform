---
- name: Configure Tempo trace retention
  ansible.builtin.copy:
    dest: >-
      {{ platform_install_dir }}/infrastructure/monitoring/tempo.yaml
    content: >-
      {{ platform_tempo_configuration | to_nice_yaml(indent=2) }}
    owner: root
    group: root
    mode: '0644'

- name: Validate Compose configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - config
      - --quiet
    chdir: "{{ platform_install_dir }}"
  changed_when: false

- name: Check bounded Tempo trace storage mount
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - /var/lib/developer-platform/tempo
  register: platform_tempo_mount
  failed_when: false
  changed_when: false

- name: Prepare bounded Tempo trace storage
  ansible.builtin.command:
    argv:
      - bash
      - scripts/setup/prepare-tempo-storage.sh
    chdir: "{{ platform_install_dir }}"
  changed_when: platform_tempo_mount.rc != 0
