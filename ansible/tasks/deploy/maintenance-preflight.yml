---
- name: >-
    Check for maintenance jobs that must not overlap deployment
  ansible.builtin.command:
    argv:
      - systemctl
      - list-units
      - --type=service
      - --state=activating,active,running
      - --no-legend
      - platform-backup.service
      - platform-backup-freshness-drill.service
      - backup-drill-*
      - platform-availability-*
  register: platform_maintenance_units
  changed_when: false

- name: >-
    Validate fixed Docker addresses before stopping services
  ansible.builtin.command:
    argv:
      - python3
      - scripts/checks/check-network-addresses.py
      - --validate-networks
    chdir: "{{ platform_install_dir }}"
  changed_when: false

- name: >-
    Refuse deployment during backup or availability maintenance
  ansible.builtin.assert:
    that: platform_maintenance_units.stdout | trim == ''
    fail_msg: >-
      Deployment cannot overlap an active backup or availability drill: {{
      platform_maintenance_units.stdout | trim }}

- name: Inspect an existing backup runner
  ansible.builtin.stat:
    path: /usr/local/sbin/platform-backup
  register: platform_installed_backup_runner

- name: Require the managed backup runner to be a regular file
  ansible.builtin.assert:
    that: >-
      not platform_installed_backup_runner.stat.exists or
      platform_installed_backup_runner.stat.isreg | default(false)
    fail_msg: >-
      Inspect the non-regular platform-backup path before updating its recovery
      code.

- name: >-
    Refresh installed backup code before enabling named-store changes
  ansible.builtin.copy:
    src: >-
      {{ platform_install_dir }}/operations/backup/scripts/backup-platform.py
    dest: /usr/local/sbin/platform-backup
    remote_src: true
    owner: root
    group: root
    mode: '0700'
  when: platform_installed_backup_runner.stat.exists

- name: >-
    Prepare selected data-store configuration before the service outage
  ansible.builtin.command:
    argv:
      - python3
      - scripts/setup/prepare-stores.py
    chdir: "{{ platform_install_dir }}"
  changed_when: false
  no_log: true
