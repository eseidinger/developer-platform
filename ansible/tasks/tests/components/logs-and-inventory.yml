---
- name: >-
    Refresh the project administrator token before log inspection
  ansible.builtin.uri:
    url: "{{ component_admin_credential.json.token_endpoint }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ component_admin_credential.json.client_id }}"
      client_secret: "{{ component_admin_credential.json.client_secret }}"
    status_code: 200
  register: component_admin_token_refresh
  no_log: true

- name: Use the refreshed project administrator token
  ansible.builtin.set_fact:
    component_admin_access_token: >-
      {{ component_admin_token_refresh.json.access_token }}
  no_log: true

- name: >-
    Verify scheduled logs show calls through both stable service names
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ component_project
      }}/logs?component=probe&tail=100
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    status_code: 200
  register: scheduled_logs
  until: >-
    'component-api' in (scheduled_logs.json.get('lines', []) |
    map(attribute='message') | join('\n')) and 'component-peer' in
    (scheduled_logs.json.get('lines', []) | map(attribute='message') |
    join('\n'))
  retries: 12
  delay: 5
  no_log: true

- name: >-
    Verify authorized component log filtering and polling cursor
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ component_project
      }}/logs?component=probe&search=component-api&tail=100
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    status_code: 200
  register: filtered_scheduled_logs
  until: >-
    filtered_scheduled_logs.json.next_cursor is string and
    (filtered_scheduled_logs.json.lines | length) > 0 and
    (filtered_scheduled_logs.json.lines | map(attribute='message') | join('\n'))
    is search('component-api')
  retries: 12
  delay: 5
  no_log: true

- name: >-
    Verify authorized resource inventory exposes the deployed component topology
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ component_project }}/resources
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    status_code: 200
  register: component_inventory
  until: >-
    component_inventory.json.state == 'ok' and 'api' in
    (component_inventory.json.deployments | map(attribute='name') | list) and
    'peer' in (component_inventory.json.services | list) and 'api-public' in
    (component_inventory.json.routes | list) and
    (component_inventory.json.deployments | selectattr('name', 'equalto', 'api')
    | first).containers[0].requests.cpu == '200m' and
    (component_inventory.json.data_services | length) == 0 and
    (component_inventory.json.quota_comparisons | length) > 0
  retries: 12
  delay: 5
  no_log: true

- name: Verify the cursor accepts a no-new-lines poll
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ component_project
      }}/logs?component=probe&after={{ filtered_scheduled_logs.json.next_cursor
      | urlencode }}&tail=100
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    status_code: 200
  register: cursor_scheduled_logs
  no_log: true

- name: >-
    Require cursor response to retain the explicit retention boundary
  ansible.builtin.assert:
    that:
      - >-
        cursor_scheduled_logs.json.retention.source == 'kubernetes-kubelet'
      - >-
        cursor_scheduled_logs.json.retention.state == 'best_effort'
  no_log: true
