---
- name: >-
    Verify migration preserved the legacy revision and component revision
    history
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ component_project }}/revisions
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    status_code: 200
  register: component_revisions
  failed_when: >-
    component_revisions.json.revisions | length < 3 or
    (component_revisions.json.revisions | selectattr('components', 'defined') |
    list | length) < 3
  no_log: true

- name: >-
    Verify configuration survived component migration and independent updates
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ component_project }}/configuration
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    status_code: 200
  register: migrated_configuration
  no_log: true

- name: Require the migrated configuration value
  ansible.builtin.assert:
    that: >-
      migrated_configuration.json['values']['COMPONENT_ACCEPTANCE_RUN'] ==
      component_run_id
  no_log: true

- name: >-
    Verify the migrated secret remains present but write-only
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ component_project }}/secrets
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    status_code: 200
  register: migrated_secret_listing
  no_log: true

- name: >-
    Require the migrated secret name without exposing its value
  ansible.builtin.assert:
    that:
      - >-
          migrated_secret_listing.json.secrets | selectattr('name', 'equalto',
          'COMPONENT_ACCEPTANCE_SECRET') | list | length == 1
      - >-
          (component_run_id ~ '-secret') not in (migrated_secret_listing.json |
          to_json)
  no_log: true

- name: Refresh the project administrator token before rollback
  ansible.builtin.uri:
    url: "{{ component_admin_credential.json.token_endpoint }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ component_admin_credential.json.client_id }}"
      client_secret: "{{ component_admin_credential.json.client_secret }}"
    status_code: 200
  register: component_admin_token_refresh
  no_log: true

- name: >-
    Use the refreshed project administrator token for rollback
  ansible.builtin.set_fact:
    component_admin_access_token: >-
      {{ component_admin_token_refresh.json.access_token }}
  no_log: true

- name: Roll back to the first component revision
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ component_project }}/rollback
    method: POST
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    body_format: json
    body:
      revision: "{{ component_deployment.json.revision }}"
    status_code: 202
  register: component_rollback
  no_log: true

- name: Wait for rollback to the first component revision
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}{{ component_rollback.json.status_url }}
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    status_code: 200
  register: component_rollback_operation
  until:
    - (component_rollback_operation.json.state | default('')) == 'succeeded'
    - >-
      (component_rollback_operation.json.readiness.state | default('')) ==
      'ready'
  retries: 60
  delay: 5
  no_log: true

- name: Require both restored services to become ready
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ component_project }}/components
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    status_code: 200
  register: component_rollback_services
  until: >-
    (component_rollback_services.json.components |
    selectattr('type', 'equalto', 'service') |
    map(attribute='status.state') | list) == ['ready', 'ready']
  retries: 60
  delay: 5
  no_log: true

- name: >-
    Require rollback to restore the original API component command
  ansible.builtin.command:
    argv:
      - "{{ platform_component_kubectl }}"
      - --kubeconfig
      - "{{ platform_component_kubeconfig }}"
      - get
      - deployment
      - api
      - -n
      - "project-{{ component_project }}"
      - -o
      - "jsonpath={.spec.template.spec.containers[0].args[*]}"
  delegate_to: "{{ platform_component_drill_host }}"
  become: "{{ platform_component_drill_become | bool }}"
  register: rollback_api_args
  changed_when: false

- name: Assert rollback restored the initial component revision
  ansible.builtin.assert:
    that: "'-text=component-api' in rollback_api_args.stdout"

- name: Read the component retirement scope
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ component_project }}/retirement-preview
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    status_code: 200
  register: component_retirement
  no_log: true

- name: >-
    Require retirement to include services and the scheduled resource while
    retaining data
  ansible.builtin.assert:
    that:
      - >-
          component_retirement.json.removes | selectattr('kind', 'equalto',
          'Deployment') | list | length == 2
      - >-
          component_retirement.json.removes | selectattr('kind', 'equalto',
          'CronJob') | list | length == 2
      - component_retirement.json.retains | length > 0
  no_log: true

- name: Report non-secret Phase 2A acceptance evidence
  ansible.builtin.debug:
    msg: >-
      PASS: {{ component_run_id }} migrated a legacy project to a protected API,
      a private peer and two scheduled probes (one successful and one safely
      failed),
      observed non-overlap, preserved configuration and write-only secrets
      through migration, isolated component updates, restored the first
      component revision, and verified retirement scope.
