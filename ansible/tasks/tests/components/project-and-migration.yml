---
- name: Create the empty disposable project
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/v1/projects"
    method: POST
    headers:
      Authorization: "Bearer {{ component_runner_token.json.access_token }}"
    body_format: json
    body:
      name: "{{ component_project }}"
    status_code: 201
  register: platform_cleanup_project_creation
  no_log: true

- name: Create a short-lived project administrator persona
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/v1/platform/test-identities"
    method: POST
    headers:
      Authorization: "Bearer {{ component_runner_token.json.access_token }}"
    body_format: json
    body:
      name: "component-admin-{{ component_run_id }}"
      role: project-admin
      project: "{{ component_project }}"
      test_run_id: "{{ component_run_id }}"
      expires_in_hours: 2
    status_code: 201
  register: component_admin_credential
  no_log: true

- name: Exchange the project administrator credential
  ansible.builtin.uri:
    url: "{{ component_admin_credential.json.token_endpoint }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ component_admin_credential.json.client_id }}"
      client_secret: "{{ component_admin_credential.json.client_secret }}"
    status_code: 200
  register: component_admin_token
  no_log: true

- name: >-
    Deploy the initial v1 single-service revision to establish migration history
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/v1/projects/{{ component_project
      }}/application
    method: PUT
    headers:
      Authorization: "Bearer {{ component_admin_token.json.access_token }}"
    body_format: json
    body:
      apiVersion: platform.eseidinger.de/v1
      kind: Application
      metadata:
        name: "{{ component_project }}"
      spec:
        components:
          - name: "{{ component_project }}"
            type: service
            runtime:
              type: container
              image: "{{ platform_component_service_image }}"
            ports:
              - name: http
                protocol: http
                port: 5678
            exposure: public
            health:
              readiness:
                profile: hello-world
    status_code: 202
  register: initial_deployment
  no_log: true

- name: Wait for the initial revision
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}{{ initial_deployment.json.status_url }}
    headers:
      Authorization: "Bearer {{ component_admin_token.json.access_token }}"
    status_code: 200
  register: initial_operation
  until:
    - >-
      (initial_operation.json.state | default('')) == 'succeeded'
    - >-
      (initial_operation.json.readiness.state | default('')) == 'ready'
  retries: 60
  delay: 5
  no_log: true

- name: Add configuration before migrating the initial revision
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/v1/projects/{{ component_project }}/configuration
    method: PUT
    headers:
      Authorization: "Bearer {{ component_admin_token.json.access_token }}"
    body_format: json
    body:
      values:
        COMPONENT_ACCEPTANCE_RUN: "{{ component_run_id }}"
    status_code: 202
  register: initial_configuration
  no_log: true

- name: Wait for configuration activation before migration
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}{{ initial_configuration.json.status_url }}
    headers:
      Authorization: "Bearer {{ component_admin_token.json.access_token }}"
    status_code: 200
  register: initial_configuration_operation
  until:
    - >-
      (initial_configuration_operation.json.state | default('')) == 'succeeded'
    - >-
      (initial_configuration_operation.json.readiness.state | default('')) ==
      'ready'
  retries: 60
  delay: 5
  no_log: true

- name: >-
    Add a write-only secret before migrating the initial revision
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/v1/projects/{{ component_project
      }}/secrets/COMPONENT_ACCEPTANCE_SECRET
    method: PUT
    headers:
      Authorization: "Bearer {{ component_admin_token.json.access_token }}"
    body_format: json
    body:
      value: "{{ component_run_id }}-secret"
    status_code: 202
  register: initial_secret
  no_log: true

- name: Require the migrated secret to remain write-only
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/v1/projects/{{ component_project }}/secrets
    headers:
      Authorization: "Bearer {{ component_admin_token.json.access_token }}"
    status_code: 200
  register: initial_secret_listing
  until: >-
    initial_secret_listing.json.secrets | selectattr('name', 'equalto',
    'COMPONENT_ACCEPTANCE_SECRET') | list | length == 1
  retries: 24
  delay: 5
  no_log: true
