---
- name: >-
    Capture both Service Deployment generations before a scheduled-only update
  ansible.builtin.command:
    argv:
      - "{{ platform_component_kubectl }}"
      - --kubeconfig
      - "{{ platform_component_kubeconfig }}"
      - get
      - deployment
      - api
      - peer
      - -n
      - "project-{{ component_project }}"
      - -o
      - >-
          jsonpath={range
          .items[*]}{.metadata.name}{'='}{.metadata.generation}{'\n'}{end}
  delegate_to: "{{ platform_component_drill_host }}"
  become: "{{ platform_component_drill_become | bool }}"
  register: services_before_scheduled_update
  changed_when: false

- name: >-
    Refresh the project administrator token before the scheduled-only update
  ansible.builtin.uri:
    url: "{{ component_admin_credential.json.token_endpoint }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ component_admin_credential.json.client_id }}"
      client_secret: "{{ component_admin_credential.json.client_secret }}"
    status_code: 200
  register: component_admin_token_refresh
  no_log: true

- name: >-
    Use the refreshed project administrator token for the scheduled-only update
  ansible.builtin.set_fact:
    component_admin_access_token: >-
      {{ component_admin_token_refresh.json.access_token }}
  no_log: true

- name: Update only the failing scheduled component
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/projects/{{ component_project }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    body_format: json
    body:
      apiVersion: platform.example/v1alpha2
      kind: Application
      metadata:
        name: "{{ component_project }}"
      spec:
        components:
          - name: api
            type: service
            runtime:
              type: container
              image: "{{ platform_component_service_image }}"
              args:
                - '-listen=:5678'
                - '-text=component-api-v2'
            ports:
              - name: http
                protocol: http
                port: 5678
          - name: peer
            type: service
            runtime:
              type: container
              image: "{{ platform_component_service_image }}"
              args:
                - '-listen=:5678'
                - '-text=component-peer'
            ports:
              - name: http
                protocol: http
                port: 5678
          - name: probe
            type: scheduled
            runtime:
              type: container
              image: "{{ platform_component_job_image }}"
              command:
                - '/bin/sh'
                - '-ec'
              args:
                - >-
                    for n in $(seq 1 10); do
                    if wget -T 3 -qO- http://api:5678/ &&
                    wget -T 3 -qO- http://peer:5678/; then
                    sleep 75; exit 0; fi; sleep 2; done; exit 1
            schedule: '* * * * *'
            timeZone: UTC
            concurrencyPolicy: Forbid
          - name: failing-probe
            type: scheduled
            # One deterministic failure must finish within the suite deadline.
            retryLimit: 0
            maxRunSeconds: 60
            runtime:
              type: container
              image: "{{ platform_component_job_image }}"
              command:
                - '/bin/sh'
                - '-ec'
              args:
                - 'echo scheduled-failure >&2; exit 1'
            schedule: '*/2 * * * *'
            timeZone: UTC
            concurrencyPolicy: Forbid
    status_code: 202
  register: scheduled_only_update
  no_log: true

- name: Wait for the scheduled-only update
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}{{ scheduled_only_update.json.status_url }}
    headers:
      Authorization: "Bearer {{ component_admin_access_token }}"
    status_code: 200
  register: scheduled_only_update_operation
  until: >-
    (scheduled_only_update_operation.json.state | default('')) == 'succeeded'
  retries: 60
  delay: 5
  no_log: true

- name: >-
    Capture both Service Deployment generations after the scheduled-only update
  ansible.builtin.command:
    argv:
      - "{{ platform_component_kubectl }}"
      - --kubeconfig
      - "{{ platform_component_kubeconfig }}"
      - get
      - deployment
      - api
      - peer
      - -n
      - "project-{{ component_project }}"
      - -o
      - >-
          jsonpath={range
          .items[*]}{.metadata.name}{'='}{.metadata.generation}{'\n'}{end}
  delegate_to: "{{ platform_component_drill_host }}"
  become: "{{ platform_component_drill_become | bool }}"
  register: services_after_scheduled_update
  changed_when: false

- name: >-
    Require a scheduled-only update not to roll either Service
  ansible.builtin.assert:
    that: >-
      services_before_scheduled_update.stdout ==
      services_after_scheduled_update.stdout
    fail_msg: >-
      A scheduled-only update changed a long-running Service Deployment.
