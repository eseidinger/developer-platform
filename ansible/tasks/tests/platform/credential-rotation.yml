---
- name: Rotate the deployment credential with bounded overlap
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ test_project
      }}/deployment-credentials/{{ deployment_credential.json.credential_id
      }}/rotate
    method: POST
    headers:
      Authorization: "Bearer {{ project_admin_token }}"
    body_format: json
    body:
      expires_in_days: 1
      overlap_hours: 1
    status_code: 201
  register: rotated_credential
  no_log: true

- name: Exchange the replacement credential
  ansible.builtin.uri:
    url: "{{ rotated_credential.json.token_endpoint }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ rotated_credential.json.client_id }}"
      client_secret: "{{ rotated_credential.json.client_secret }}"
    status_code: 200
  register: replacement_token_response
  no_log: true

- name: Verify predecessor remains usable during overlap
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/projects"
    headers:
      Authorization: >-
        Bearer {{ deployment_token_response.json.access_token }}
    status_code: 200
  no_log: true

- name: Verify replacement is usable during overlap
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/projects"
    headers:
      Authorization: >-
        Bearer {{ replacement_token_response.json.access_token }}
    status_code: 200
  no_log: true

- name: Revoke the predecessor credential
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ test_project
      }}/deployment-credentials/{{ deployment_credential.json.credential_id }}
    method: DELETE
    headers:
      Authorization: "Bearer {{ project_admin_token }}"
    status_code:
      - 200
      - 202
  register: predecessor_revocation
  no_log: true

- name: Require completed predecessor provider cleanup
  ansible.builtin.assert:
    that: predecessor_revocation.json.status == 'revoked'
    fail_msg: >-
      Predecessor access is denied, but provider cleanup must be retried.


- name: >-
    Verify the predecessor's issued token is immediately denied
  ansible.builtin.uri:
    url: "{{ platform_api_url }}/projects"
    headers:
      Authorization: >-
        Bearer {{ deployment_token_response.json.access_token }}
    status_code: 403
  no_log: true

- name: Report non-secret platform acceptance evidence
  ansible.builtin.debug:
    msg: >-
      PASS: {{ test_run_id }} created an empty project, exercised
      viewer/developer/admin personas, deployed revision {{
      first_deployment.json.revision }} with CI credentials, and proved bounded
      rotation plus immediate revocation.
