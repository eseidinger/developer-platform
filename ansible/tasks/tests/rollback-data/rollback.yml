---
- name: Roll back the application to revision one
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ rollback_project }}/rollback
    method: POST
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
      If-Match: '"{{ rollback_second_deployment.json.revision }}"'
    body_format: json
    body:
      revision: "{{ rollback_first_deployment.json.revision }}"
    status_code: 202
  register: rollback_request
  no_log: true

- name: Wait for application rollback
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}{{ rollback_request.json.status_url }}
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    status_code: 200
  register: rollback_operation
  until:
    - >-
      (rollback_operation.json.state | default('')) == 'succeeded'
    - >-
      (rollback_operation.json.readiness.state | default('')) == 'ready'
  retries: 60
  delay: 5
  no_log: true

- name: >-
    Require the named database visit to survive application rollback
  ansible.builtin.command:
    argv:
      - >-
        {{ platform_rollback_drill_install_dir }}/.runtime/bin/kubectl
      - --kubeconfig
      - >-
        {{ platform_rollback_drill_install_dir }}/.runtime/admin.kubeconfig
      - -n
      - "project-{{ rollback_project }}"
      - exec
      - deployment/web
      - --
      - python
      - -c
      - "import json,urllib.request; print(json.load(urllib.request.urlopen('ht\
          tp://127.0.0.1:8080/api/visits',timeout=10))['visits'])"
    chdir: "{{ platform_rollback_drill_install_dir }}"
  delegate_to: "{{ platform_rollback_drill_host }}"
  become: true
  register: rollback_visit_after
  changed_when: false
  failed_when: >-
    rollback_visit_after.rc != 0 or rollback_visit_after.stdout | trim != '2'
  no_log: true

- name: >-
    Verify the current secret is injected after rollback without disclosing it
  ansible.builtin.command:
    argv:
      - >-
        {{ platform_rollback_drill_install_dir }}/.runtime/bin/kubectl
      - --kubeconfig
      - >-
        {{ platform_rollback_drill_install_dir }}/.runtime/admin.kubeconfig
      - -n
      - "project-{{ rollback_project }}"
      - exec
      - deployment/web
      - --
      - python
      - -c
      - >-
          import os,sys; sys.exit(0 if os.environ.get('ROLLBACK_PROBE') ==
          'current-' + os.environ.get('ACCEPTANCE_RUN_ID','') else 1)
    chdir: "{{ platform_rollback_drill_install_dir }}"
  delegate_to: "{{ platform_rollback_drill_host }}"
  become: true
  changed_when: false
  no_log: true

- name: >-
    Require rollback to retain the current secret metadata without disclosure
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ rollback_project }}/secrets
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    status_code: 200
  register: rollback_secret_after
  failed_when: >-
    rollback_secret_after.json.secrets | length != 1 or
    rollback_secret_after.json.secrets[0].name != 'ROLLBACK_PROBE' or
    rollback_secret_after.json.secrets[0].version | int != 2 or
    rollback_secret_after.json.secrets[0].state != 'active' or
    rollback_secret_after.json | to_json is search('first-' + rollback_run_id +
    '|current-' + rollback_run_id)
  no_log: true

- name: >-
    Require revision metadata to disclose current secret semantics
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/projects/{{ rollback_project }}/revisions
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    status_code: 200
  register: rollback_revisions
  failed_when: >-
    rollback_revisions.json.current_revision | int !=
    rollback_request.json.revision | int or
    rollback_revisions.json.revisions[0].dependencies.application_secrets.state
    != 'current_only'
  no_log: true

- name: >-
    Require the named resource to remain active after rollback
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/v1/resources/{{
      rollback_resource_request.json.resource_id }}
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    status_code: 200
  register: rollback_resource_after
  failed_when: >-
    rollback_resource_after.json.observed_state | default('') != 'active'
  no_log: true

- name: >-
    Require the same binding to remain active after rollback
  ansible.builtin.uri:
    url: >-
      {{ platform_api_url }}/v1/projects/{{ rollback_project
      }}/resource-bindings
    headers:
      Authorization: "Bearer {{ rollback_access_token }}"
    status_code: 200
  register: rollback_binding_after
  failed_when: >-
    rollback_binding_after.json.bindings | selectattr('grant_id', 'equalto',
    rollback_binding_request.json.grant_id) | selectattr('observed_state',
    'equalto', 'active') | list | length != 1
  no_log: true
