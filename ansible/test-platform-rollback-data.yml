---
- name: >-
    Prove application rollback retains named-store data and the current secret
    version
  hosts: localhost
  gather_facts: false
  vars:
    platform_rollback_drill_install_dir: /opt/developer-platform
  tasks:

    - name: >-
        Require protected runner configuration and a platform inventory host
      ansible.builtin.assert:
        that:
          - platform_api_url is defined
          - platform_oidc_token_url is defined
          - platform_test_runner_client_id is defined
          - platform_test_runner_client_secret is defined
          - platform_rollback_drill_host is defined
          - platform_rollback_drill_host in groups['all']
          - platform_rollback_drill_install_dir | length > 1
          - platform_rollback_drill_image is defined
          - >-
              platform_rollback_drill_image is
              match('^[A-Za-z0-9][A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$')
        fail_msg: >-
          Supply the protected runner configuration, a digest-pinned
          examples/web-postgres image and platform_rollback_drill_host from the
          normal platform inventory. The host runs bounded workload checks.
      no_log: true

    - name: Establish unique disposable rollback inputs
      ansible.builtin.set_fact:
        rollback_run_id: "{{ lookup('pipe', 'date +%s') }}-{{ 99999 | random }}"
        rollback_project: >-
          rollback-{{ lookup('pipe', 'date +%s') }}-{{ 9999 | random }}


    - name: Require safe generated rollback identifiers
      ansible.builtin.assert:
        that:
          - >-
              rollback_project is
              match('^(?:[a-z]|[a-z][a-z0-9-]{0,30}[a-z0-9])$')

    - name: Exchange the runner credential
      ansible.builtin.uri:
        url: "{{ platform_oidc_token_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ platform_test_runner_client_id }}"
          client_secret: "{{ platform_test_runner_client_secret }}"
        status_code: 200
      register: rollback_runner_token
      no_log: true

    - name: Use the initial rollback drill token
      ansible.builtin.set_fact:
        rollback_access_token: "{{ rollback_runner_token.json.access_token }}"
      no_log: true

    - name: Exercise data-aware rollback on a disposable project
      block:

        - name: Create the owned project, resource, and binding
          ansible.builtin.import_tasks: >-
            tasks/drills/rollback-data/resource-binding.yml

        - name: Create revisions and rotate the write-only secret
          ansible.builtin.import_tasks: >-
            tasks/drills/rollback-data/revisions-and-secrets.yml

        - name: Verify data and current secrets survive rollback
          ansible.builtin.import_tasks: tasks/drills/rollback-data/rollback.yml
      always:

        - name: >-
            Refresh the runner token before rollback-project cleanup
          ansible.builtin.uri:
            url: "{{ platform_oidc_token_url }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ platform_test_runner_client_id }}"
              client_secret: "{{ platform_test_runner_client_secret }}"
            status_code: 200
          register: rollback_cleanup_response
          failed_when: false
          no_log: true

        - name: Select the rollback cleanup token
          ansible.builtin.set_fact:
            rollback_cleanup_token: >-
              {{ rollback_cleanup_response.get('json', {}).get('access_token',
              '') }}
          no_log: true

        - name: Read rollback-project retirement scope
          ansible.builtin.uri:
            url: >-
              {{ platform_api_url }}/projects/{{ rollback_project
              }}/retirement-preview
            headers:
              Authorization: "Bearer {{ rollback_cleanup_token }}"
            status_code:
              - 200
              - 404
          register: rollback_cleanup_preview
          failed_when: false
          when:
            - rollback_cleanup_token | length > 0
            - rollback_project_created | default(false)
          no_log: true

        - name: Retire the disposable rollback project
          ansible.builtin.uri:
            url: >-
              {{ platform_api_url }}/projects/{{ rollback_project }}/retire
            method: POST
            headers:
              Authorization: "Bearer {{ rollback_cleanup_token }}"
            body_format: json
            body:
              confirm_name: "{{ rollback_project }}"
              scope_token: "{{ rollback_cleanup_preview.json.scope_token }}"
            status_code:
              - 200
              - 202
              - 404
              - 409
          register: rollback_cleanup
          until: rollback_cleanup.status != 202
          retries: 60
          delay: 5
          failed_when: false
          when:
            - rollback_cleanup_token | length > 0
            - rollback_project_created | default(false)
            - >-
              rollback_cleanup_preview.status | default(0) | int == 200
          no_log: true

    - name: Report non-secret data-aware rollback evidence
      ansible.builtin.debug:
        msg: >-
          PASS: {{ rollback_project }} restored application revision one while
          retaining the named database visit count and active secret version 2
          without disclosing its value.
