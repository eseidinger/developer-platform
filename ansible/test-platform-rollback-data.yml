---
- name: Prove application rollback retains named-store data and the current secret version
  hosts: localhost
  gather_facts: false
  vars:
    platform_rollback_drill_install_dir: /opt/developer-platform
  tasks:
    - name: Require protected runner configuration and a platform inventory host
      ansible.builtin.assert:
        that:
          - platform_api_url is defined
          - platform_oidc_token_url is defined
          - platform_test_runner_client_id is defined
          - platform_test_runner_client_secret is defined
          - platform_rollback_drill_host is defined
          - platform_rollback_drill_host in groups['all']
          - platform_rollback_drill_install_dir | length > 1
          - platform_rollback_drill_image is defined
          - platform_rollback_drill_image is match('^[A-Za-z0-9][A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$')
        fail_msg: >-
          Supply the protected runner configuration, a digest-pinned
          examples/web-postgres image and platform_rollback_drill_host from the
          normal platform inventory. The host runs bounded workload checks.
      no_log: true

    - name: Establish unique disposable rollback inputs
      ansible.builtin.set_fact:
        rollback_run_id: "{{ lookup('pipe', 'date +%s') }}-{{ 99999 | random }}"
        rollback_project: "rollback-{{ lookup('pipe', 'date +%s') }}-{{ 9999 | random }}"

    - name: Require safe generated rollback identifiers
      ansible.builtin.assert:
        that:
          - rollback_project is match('^(?:[a-z]|[a-z][a-z0-9-]{0,30}[a-z0-9])$')

    - name: Exchange the runner credential
      ansible.builtin.uri:
        url: "{{ platform_oidc_token_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ platform_test_runner_client_id }}"
          client_secret: "{{ platform_test_runner_client_secret }}"
        status_code: 200
      register: rollback_runner_token
      no_log: true

    - name: Use the initial rollback drill token
      ansible.builtin.set_fact:
        rollback_access_token: "{{ rollback_runner_token.json.access_token }}"
      no_log: true

    - name: Exercise data-aware rollback on a disposable project
      block:
        - name: Create the disposable rollback project
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects"
            method: POST
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            body_format: json
            body: {name: "{{ rollback_project }}"}
            status_code: 201
          no_log: true

        - name: Record confirmed ownership of the disposable project
          ansible.builtin.set_fact:
            rollback_project_created: true

        - name: Create a named PostgreSQL resource for the rollback project
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/v1/projects/{{ rollback_project }}/resources"
            method: POST
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            body_format: json
            body: {name: state, provider: postgresql}
            status_code: 202
          register: rollback_resource_request
          no_log: true

        - name: Wait for the named PostgreSQL resource
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/v1/resources/{{ rollback_resource_request.json.resource_id }}"
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_resource_ready
          until: rollback_resource_ready.json.observed_state | default('') == 'active'
          retries: 60
          delay: 5
          no_log: true

        - name: Bind the named resource to the web component
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/v1/projects/{{ rollback_project }}/resource-bindings"
            method: POST
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            body_format: json
            body:
              resource_id: "{{ rollback_resource_request.json.resource_id }}"
              component: web
              mode: read-write
            status_code: 202
          register: rollback_binding_request
          no_log: true

        - name: Wait for the web component binding
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/v1/projects/{{ rollback_project }}/resource-bindings"
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_binding_ready
          until: >-
            rollback_binding_ready.json.bindings |
            selectattr('grant_id', 'equalto', rollback_binding_request.json.grant_id) |
            selectattr('observed_state', 'equalto', 'active') | list | length == 1
          retries: 60
          delay: 5
          no_log: true

        - name: Deploy the first application revision
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}"
            method: PUT
            headers:
              Authorization: "Bearer {{ rollback_access_token }}"
              If-Match: '"0"'
            body_format: json
            body:
              apiVersion: platform.example/v1alpha2
              kind: Application
              metadata: {name: "{{ rollback_project }}", project: "{{ rollback_project }}"}
              spec:
                components:
                  - name: web
                    type: service
                    runtime: {type: container, image: "{{ platform_rollback_drill_image }}"}
                    ports: [{name: http, protocol: http, port: 8080}]
                    replicas: 1
                    exposure: private
                    bindings:
                      - bindingId: "{{ rollback_binding_request.json.grant_id }}"
                        envPrefix: ''
                    health: {readiness: {path: /health/ready}}
                    resources:
                      requests: {cpu: 100m, memory: 128Mi}
                      limits: {cpu: 500m, memory: 256Mi}
                configuration:
                  values: {DEMO_FAIL_READY: 'false', ACCEPTANCE_RUN_ID: "{{ rollback_run_id }}"}
            status_code: 202
          register: rollback_first_deployment
          no_log: true

        - name: Wait for the first application revision
          ansible.builtin.uri:
            url: "{{ platform_api_url }}{{ rollback_first_deployment.json.status_url }}"
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_first_operation
          until:
            - (rollback_first_operation.json.state | default('')) == 'succeeded'
            - (rollback_first_operation.json.readiness.state | default('')) == 'ready'
          retries: 60
          delay: 5
          no_log: true

        - name: Write the first database-backed visit through the bound workload
          ansible.builtin.command:
            argv:
              - "{{ platform_rollback_drill_install_dir }}/.runtime/bin/kubectl"
              - --kubeconfig
              - "{{ platform_rollback_drill_install_dir }}/.runtime/admin.kubeconfig"
              - -n
              - "project-{{ rollback_project }}"
              - exec
              - deployment/web
              - --
              - python
              - -c
              - >-
                import json,urllib.request;
                print(json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/visits',timeout=10))['visits'])
            chdir: "{{ platform_rollback_drill_install_dir }}"
          delegate_to: "{{ platform_rollback_drill_host }}"
          become: true
          register: rollback_initial_visit
          changed_when: false
          failed_when: >-
            rollback_initial_visit.rc != 0 or rollback_initial_visit.stdout | trim != '1'
          no_log: true

        - name: Create the first write-only secret version
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}/secrets/ROLLBACK_PROBE"
            method: PUT
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            body_format: json
            body: {value: "first-{{ rollback_run_id }}"}
            status_code: 202
          no_log: true

        - name: Wait for first secret activation
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}/secrets"
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_first_secret
          until:
            - (rollback_first_secret.json.activation.state | default('')) == 'active'
            - rollback_first_secret.json.secrets | selectattr('name', 'equalto', 'ROLLBACK_PROBE') | list | length == 1
          retries: 60
          delay: 5
          no_log: true

        - name: Rotate to the current write-only secret version
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}/secrets/ROLLBACK_PROBE"
            method: PUT
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            body_format: json
            body: {value: "current-{{ rollback_run_id }}"}
            status_code: 202
          no_log: true

        - name: Wait for rotated secret activation
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}/secrets"
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_rotated_secret
          until:
            - (rollback_rotated_secret.json.activation.state | default('')) == 'active'
            - rollback_rotated_secret.json.secrets[0].version | int == 2
            - rollback_rotated_secret.json.secrets[0].state == 'rotating'
          retries: 60
          delay: 5
          no_log: true

        - name: Confirm the current secret version
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}/secrets/ROLLBACK_PROBE/confirm"
            method: POST
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_secret_confirmation
          failed_when: >-
            rollback_secret_confirmation.json.version | int != 2 or
            rollback_secret_confirmation.json.state != 'active'
          no_log: true

        - name: Refresh the runner token before the second revision and rollback
          ansible.builtin.uri:
            url: "{{ platform_oidc_token_url }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ platform_test_runner_client_id }}"
              client_secret: "{{ platform_test_runner_client_secret }}"
            status_code: 200
          register: rollback_refreshed_runner_token
          no_log: true

        - name: Use the refreshed rollback drill token
          ansible.builtin.set_fact:
            rollback_access_token: "{{ rollback_refreshed_runner_token.json.access_token }}"
          no_log: true

        - name: Deploy a second application revision
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}"
            method: PUT
            headers:
              Authorization: "Bearer {{ rollback_access_token }}"
              If-Match: '"{{ rollback_first_deployment.json.revision }}"'
            body_format: json
            body:
              apiVersion: platform.example/v1alpha2
              kind: Application
              metadata: {name: "{{ rollback_project }}", project: "{{ rollback_project }}"}
              spec:
                components:
                  - name: web
                    type: service
                    runtime: {type: container, image: "{{ platform_rollback_drill_image }}"}
                    ports: [{name: http, protocol: http, port: 8080}]
                    replicas: 1
                    exposure: private
                    bindings:
                      - bindingId: "{{ rollback_binding_request.json.grant_id }}"
                        envPrefix: ''
                    health: {readiness: {path: /health/ready}}
                    resources:
                      requests: {cpu: 100m, memory: 128Mi}
                      limits: {cpu: 600m, memory: 256Mi}
                configuration:
                  values: {DEMO_FAIL_READY: 'false', ACCEPTANCE_RUN_ID: "{{ rollback_run_id }}"}
            status_code: 202
          register: rollback_second_deployment
          no_log: true

        - name: Wait for the second application revision
          ansible.builtin.uri:
            url: "{{ platform_api_url }}{{ rollback_second_deployment.json.status_url }}"
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_second_operation
          until:
            - (rollback_second_operation.json.state | default('')) == 'succeeded'
            - (rollback_second_operation.json.readiness.state | default('')) == 'ready'
          retries: 60
          delay: 5
          no_log: true

        - name: Roll back the application to revision one
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}/rollback"
            method: POST
            headers:
              Authorization: "Bearer {{ rollback_access_token }}"
              If-Match: '"{{ rollback_second_deployment.json.revision }}"'
            body_format: json
            body: {revision: "{{ rollback_first_deployment.json.revision }}"}
            status_code: 202
          register: rollback_request
          no_log: true

        - name: Wait for application rollback
          ansible.builtin.uri:
            url: "{{ platform_api_url }}{{ rollback_request.json.status_url }}"
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_operation
          until:
            - (rollback_operation.json.state | default('')) == 'succeeded'
            - (rollback_operation.json.readiness.state | default('')) == 'ready'
          retries: 60
          delay: 5
          no_log: true

        - name: Require the named database visit to survive application rollback
          ansible.builtin.command:
            argv:
              - "{{ platform_rollback_drill_install_dir }}/.runtime/bin/kubectl"
              - --kubeconfig
              - "{{ platform_rollback_drill_install_dir }}/.runtime/admin.kubeconfig"
              - -n
              - "project-{{ rollback_project }}"
              - exec
              - deployment/web
              - --
              - python
              - -c
              - >-
                import json,urllib.request;
                print(json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/visits',timeout=10))['visits'])
            chdir: "{{ platform_rollback_drill_install_dir }}"
          delegate_to: "{{ platform_rollback_drill_host }}"
          become: true
          register: rollback_visit_after
          changed_when: false
          failed_when: >-
            rollback_visit_after.rc != 0 or rollback_visit_after.stdout | trim != '2'
          no_log: true

        - name: Verify the current secret is injected after rollback without disclosing it
          ansible.builtin.command:
            argv:
              - "{{ platform_rollback_drill_install_dir }}/.runtime/bin/kubectl"
              - --kubeconfig
              - "{{ platform_rollback_drill_install_dir }}/.runtime/admin.kubeconfig"
              - -n
              - "project-{{ rollback_project }}"
              - exec
              - deployment/web
              - --
              - python
              - -c
              - >-
                import os,sys;
                sys.exit(0 if os.environ.get('ROLLBACK_PROBE') ==
                'current-' + os.environ.get('ACCEPTANCE_RUN_ID','') else 1)
            chdir: "{{ platform_rollback_drill_install_dir }}"
          delegate_to: "{{ platform_rollback_drill_host }}"
          become: true
          changed_when: false
          no_log: true

        - name: Require rollback to retain the current secret metadata without disclosure
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}/secrets"
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_secret_after
          failed_when: >-
            rollback_secret_after.json.secrets | length != 1 or
            rollback_secret_after.json.secrets[0].name != 'ROLLBACK_PROBE' or
            rollback_secret_after.json.secrets[0].version | int != 2 or
            rollback_secret_after.json.secrets[0].state != 'active' or
            rollback_secret_after.json | to_json is search('first-' + rollback_run_id + '|current-' + rollback_run_id)
          no_log: true

        - name: Require revision metadata to disclose current secret semantics
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}/revisions"
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_revisions
          failed_when: >-
            rollback_revisions.json.current_revision | int != rollback_request.json.revision | int or
            rollback_revisions.json.revisions[0].dependencies.application_secrets.state != 'current_only'
          no_log: true

        - name: Require the named resource to remain active after rollback
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/v1/resources/{{ rollback_resource_request.json.resource_id }}"
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_resource_after
          failed_when: rollback_resource_after.json.observed_state | default('') != 'active'
          no_log: true

        - name: Require the same binding to remain active after rollback
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/v1/projects/{{ rollback_project }}/resource-bindings"
            headers: {Authorization: "Bearer {{ rollback_access_token }}"}
            status_code: 200
          register: rollback_binding_after
          failed_when: >-
            rollback_binding_after.json.bindings |
            selectattr('grant_id', 'equalto', rollback_binding_request.json.grant_id) |
            selectattr('observed_state', 'equalto', 'active') | list | length != 1
          no_log: true
      always:
        - name: Refresh the runner token before rollback-project cleanup
          ansible.builtin.uri:
            url: "{{ platform_oidc_token_url }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ platform_test_runner_client_id }}"
              client_secret: "{{ platform_test_runner_client_secret }}"
            status_code: 200
          register: rollback_cleanup_response
          failed_when: false
          no_log: true

        - name: Select the rollback cleanup token
          ansible.builtin.set_fact:
            rollback_cleanup_token: "{{ rollback_cleanup_response.get('json', {}).get('access_token', '') }}"
          no_log: true

        - name: Read rollback-project retirement scope
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}/retirement-preview"
            headers: {Authorization: "Bearer {{ rollback_cleanup_token }}"}
            status_code: [200, 404]
          register: rollback_cleanup_preview
          failed_when: false
          when:
            - rollback_cleanup_token | length > 0
            - rollback_project_created | default(false)
          no_log: true

        - name: Retire the disposable rollback project
          ansible.builtin.uri:
            url: "{{ platform_api_url }}/projects/{{ rollback_project }}/retire"
            method: POST
            headers: {Authorization: "Bearer {{ rollback_cleanup_token }}"}
            body_format: json
            body:
              confirm_name: "{{ rollback_project }}"
              scope_token: "{{ rollback_cleanup_preview.json.scope_token }}"
            status_code: [200, 202, 404, 409]
          register: rollback_cleanup
          until: rollback_cleanup.status != 202
          retries: 60
          delay: 5
          failed_when: false
          when:
            - rollback_cleanup_token | length > 0
            - rollback_project_created | default(false)
            - rollback_cleanup_preview.status | default(0) | int == 200
          no_log: true

    - name: Report non-secret data-aware rollback evidence
      ansible.builtin.debug:
        msg: >-
          PASS: {{ rollback_project }} restored application revision one while retaining the
          named database visit count and active secret version 2 without disclosing its value.
