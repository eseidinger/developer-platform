---
- name: >-
    Accept reserved-capacity admission with a disposable project
  hosts: localhost
  gather_facts: false
  vars:
    platform_capacity_image: hashicorp/http-echo:1.0.0
    platform_capacity_padding_image: busybox:1.36.1
    platform_capacity_drill_kubeconfig: >-
      /opt/developer-platform/.runtime/admin.kubeconfig
    platform_capacity_drill_install_dir: /opt/developer-platform
    platform_capacity_drill_host: >-
      {{ (groups.get('developer_platform', []) | first) | default('') }}
  tasks:

    - name: >-
        Require protected runner configuration and explicit capacity-drill
        approval
      ansible.builtin.assert:
        that:
          - platform_allow_capacity_drill | default(false) | bool
          - >-
              platform_capacity_drill_acknowledgement | default('') ==
              'I_ACCEPT_CAPACITY_DRILL'
          - platform_api_url is defined
          - platform_oidc_token_url is defined
          - platform_test_runner_client_id is defined
          - platform_test_runner_client_secret is defined
          - platform_capacity_drill_host is defined
          - platform_capacity_drill_host in groups['all']
          - platform_capacity_drill_kubeconfig | length > 1
          - platform_capacity_drill_install_dir | length > 1
        fail_msg: >-
          Supply the protected runner configuration and normal platform
          inventory, then set platform_allow_capacity_drill=true and acknowledge
          I_ACCEPT_CAPACITY_DRILL. The drill temporarily recreates platform-api
          and restores its exact original environment.
      no_log: true

    - name: Establish a unique disposable capacity project
      ansible.builtin.set_fact:
        capacity_project: >-
          {{ platform_capacity_project | default('capacity-' + lookup('pipe',
          'date +%s') + '-' + (9999 | random | string)) }}

    - name: Require a valid capacity project name
      ansible.builtin.assert:
        that: >-
          capacity_project is match('^(?:[a-z]|[a-z][a-z0-9-]{0,30}[a-z0-9])$')


    - name: Derive the temporary capacity-reservation namespace
      ansible.builtin.set_fact:
        capacity_padding_namespace: "platform-{{ capacity_project }}"

    - name: >-
        Read the exact platform environment before temporary admission
        enablement
      ansible.builtin.slurp:
        src: "{{ platform_capacity_drill_install_dir }}/.env"
      delegate_to: "{{ platform_capacity_drill_host }}"
      become: true
      register: capacity_original_environment
      no_log: true

    - name: Exercise capacity admission
      block:

        - name: >-
            Temporarily enable admission and measure baseline capacity
          ansible.builtin.import_tasks: >-
            tasks/drills/capacity-admission/baseline.yml

        - name: >-
            Reserve capacity and verify rejection before side effects
          ansible.builtin.import_tasks: >-
            tasks/drills/capacity-admission/reservation.yml

        - name: Release the reservation and verify admission recovers
          ansible.builtin.import_tasks: >-
            tasks/drills/capacity-admission/recovery.yml
      always:

        - name: Remove any remaining temporary capacity reservation
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - "{{ platform_capacity_drill_kubeconfig }}"
              - delete
              - namespace
              - "{{ capacity_padding_namespace }}"
              - --ignore-not-found=true
              - --wait=false
          delegate_to: "{{ platform_capacity_drill_host }}"
          become: true
          changed_when: false
          failed_when: false

        - name: Restore the exact original platform environment
          ansible.builtin.copy:
            content: "{{ capacity_original_environment.content | b64decode }}"
            dest: "{{ platform_capacity_drill_install_dir }}/.env"
            owner: root
            group: root
            mode: '0600'
          delegate_to: "{{ platform_capacity_drill_host }}"
          become: true
          no_log: true

        - name: Recreate only the Platform API with its original policy
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - up
              - -d
              - --force-recreate
              - --wait
              - --wait-timeout
              - '120'
              - platform-api
            chdir: "{{ platform_capacity_drill_install_dir }}"
          delegate_to: "{{ platform_capacity_drill_host }}"
          become: true
          register: capacity_policy_restore
          until: capacity_policy_restore.rc == 0
          retries: 3
          delay: 5
          changed_when: true

        - name: Refresh runner token before capacity-project cleanup
          ansible.builtin.uri:
            url: "{{ platform_oidc_token_url }}"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: "{{ platform_test_runner_client_id }}"
              client_secret: "{{ platform_test_runner_client_secret }}"
            status_code: 200
          register: capacity_cleanup_token
          failed_when: false
          no_log: true

        - name: Read capacity-project retirement scope
          vars:
            capacity_cleanup_access_token: >-
              {{ capacity_cleanup_token.get('json', {}).get('access_token', '')
              }}
          ansible.builtin.uri:
            url: >-
              {{ platform_api_url }}/projects/{{ capacity_project
              }}/retirement-preview
            headers:
              Authorization: "Bearer {{ capacity_cleanup_access_token }}"
            status_code:
              - 200
              - 404
          register: capacity_cleanup_preview
          failed_when: false
          when: capacity_cleanup_access_token | length > 0
          no_log: true

        - name: Retire the disposable capacity project
          vars:
            capacity_cleanup_access_token: >-
              {{ capacity_cleanup_token.get('json', {}).get('access_token', '')
              }}
          ansible.builtin.uri:
            url: >-
              {{ platform_api_url }}/projects/{{ capacity_project }}/retire
            method: POST
            headers:
              Authorization: "Bearer {{ capacity_cleanup_access_token }}"
            body_format: json
            body:
              confirm_name: "{{ capacity_project }}"
              scope_token: "{{ capacity_cleanup_preview.json.scope_token }}"
            status_code:
              - 200
              - 202
              - 404
              - 409
          register: capacity_cleanup
          until: capacity_cleanup.status != 202
          retries: 60
          delay: 5
          failed_when: false
          when:
            - capacity_cleanup_access_token | length > 0
            - >-
              capacity_cleanup_preview.status | default(0) | int == 200
          no_log: true

    - name: Report non-secret capacity admission evidence
      ansible.builtin.debug:
        msg: >-
          PASS: {{ capacity_project }} rejected the oversized rollout and
          admitted the within-reserve workload.
