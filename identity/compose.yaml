services:
  keycloak-db-init:
    image: postgres:18.6-trixie
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        until pg_isready -h postgres -U postgres -d postgres; do sleep 1; done
        if ! psql -h postgres -U postgres -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='keycloak'" | grep -qx 1; then
          psql -h postgres -U postgres -d postgres -c "CREATE ROLE keycloak LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '$$KEYCLOAK_DB_PASSWORD'"
        else
          psql -h postgres -U postgres -d postgres -c "ALTER ROLE keycloak PASSWORD '$$KEYCLOAK_DB_PASSWORD'"
        fi
        if ! psql -h postgres -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='keycloak'" | grep -qx 1; then
          psql -h postgres -U postgres -d postgres -c "CREATE DATABASE keycloak OWNER keycloak"
        fi
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init.py}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run scripts/init.py}
    networks: [platform]
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.1
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run scripts/init.py}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init.py}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: https://${IDENTITY_DOMAIN:-identity.localhost}
      KC_PROXY_HEADERS: xforwarded
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-platform.localhost}
    volumes:
      - ./realm-platform.json:/opt/keycloak/data/import/realm-platform.json:ro
    networks: [platform]
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: 1

  keycloak-realm-init:
    image: quay.io/keycloak/keycloak:26.4.1
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master \
          --user admin --password "$$KEYCLOAK_ADMIN_PASSWORD"; do sleep 2; done
        client_id="$$(/opt/keycloak/bin/kcadm.sh get clients -r platform -q clientId=platform-portal --fields id \
          | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p')"
        if [ -z "$$client_id" ]; then
          /opt/keycloak/bin/kcadm.sh create clients -r platform \
            -s clientId=platform-portal -s name='Developer Platform Portal' -s enabled=true \
            -s protocol=openid-connect -s publicClient=true -s standardFlowEnabled=true \
            -s directAccessGrantsEnabled=false
          client_id="$$(/opt/keycloak/bin/kcadm.sh get clients -r platform -q clientId=platform-portal --fields id \
            | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p')"
        fi
        test -n "$$client_id"
        /opt/keycloak/bin/kcadm.sh update "clients/$$client_id" -r platform \
          -s "redirectUris=[\"https://$$PLATFORM_DOMAIN/*\",\"http://localhost/*\",\"http://localhost:8000/*\",\"http://127.0.0.1:8000/*\",\"https://platform.localhost/*\"]" \
          -s "webOrigins=[\"https://$$PLATFORM_DOMAIN\",\"http://localhost\",\"http://localhost:5173\",\"http://localhost:8000\",\"http://127.0.0.1:8000\",\"https://platform.localhost\"]" \
          -s 'attributes={"pkce.code.challenge.method":"S256"}' \
          -s 'protocolMappers=[{"name":"platform-api audience","protocol":"openid-connect","protocolMapper":"oidc-audience-mapper","consentRequired":false,"config":{"included.client.audience":"platform-api","id.token.claim":"false","access.token.claim":"true"}}]'
        provisioner_id="$$(/opt/keycloak/bin/kcadm.sh get clients -r platform -q clientId=platform-credential-provisioner --fields id \
          | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p')"
        if [ -z "$$provisioner_id" ]; then
          /opt/keycloak/bin/kcadm.sh create clients -r platform \
            -s clientId=platform-credential-provisioner -s name='Platform Credential Provisioner' \
            -s enabled=true -s protocol=openid-connect -s publicClient=false \
            -s serviceAccountsEnabled=true -s standardFlowEnabled=false -s directAccessGrantsEnabled=false \
            -s "secret=$$KEYCLOAK_PROVISIONER_SECRET"
          provisioner_id="$$(/opt/keycloak/bin/kcadm.sh get clients -r platform -q clientId=platform-credential-provisioner --fields id \
            | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p')"
        else
          /opt/keycloak/bin/kcadm.sh update "clients/$$provisioner_id" -r platform \
            -s enabled=true -s serviceAccountsEnabled=true -s "secret=$$KEYCLOAK_PROVISIONER_SECRET"
        fi
        service_user_id="$$(/opt/keycloak/bin/kcadm.sh get "clients/$$provisioner_id/service-account-user" -r platform --fields id \
          | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p')"
        /opt/keycloak/bin/kcadm.sh add-roles -r platform --uid "$$service_user_id" \
          --cclientid realm-management --rolename manage-clients
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init.py}
      KEYCLOAK_PROVISIONER_SECRET: ${KEYCLOAK_PROVISIONER_SECRET:?Run scripts/init.py}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-platform.localhost}
    networks: [platform]
    depends_on:
      keycloak:
        condition: service_started
